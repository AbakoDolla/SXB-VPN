name: 🔍 AUDIT LECTURE SEULE VPS (temporaire — session Arena)

# ⚠️ COPIE DE PATCH CI v4 — À APPLIQUER MANUELLEMENT par le propriétaire du dépôt.
# Remplace intégralement .github/workflows/vps-audit-ro.yml (voir
# scripts/ci-patches/INSTRUCTIONS_AUDIT.md).
#
# v4 → rapport COMPLET en commentaires d'issue (chunks de 60 000 caractères ;
# la v3 tronquait à 17 000 et perdait les sections DB/transport). Le relais git
# est aussi réparé : git add -f car .gitignore contient *.log (cause prouvée
# de l'échec « nothing to commit » des v2/v3). L'agent lit l'issue via
# api.github.com. À clôturer après usage.
#
# STRICTEMENT LECTURE SEULE côté production — voir scripts/ci-patches/audit-remote.sh

on:
  push:
    branches: [arena/019fb186-sxb-vpn]
    paths:
      - '.github/workflows/vps-audit-ro.yml'
      - 'scripts/ci-patches/audit-remote.sh'
  workflow_dispatch:

permissions:
  contents: write   # relais git (de secours, avec diagnostics)
  issues: write     # relais principal : issue [AUDIT] contenant le rapport

jobs:
  audit-complet:
    name: Audit VPS (lecture seule) + sondes publiques
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (pour audit-remote.sh)
        uses: actions/checkout@v4

      - name: Sondes publiques — ce que VOIT le téléphone
        run: |
          set +e
          {
          echo "════════════════ SONDES PUBLIQUES (runner GitHub) $(date -u '+%Y-%m-%d %H:%M:%S') UTC ════════════════"
          echo "=== TLS 443 public (SNI vpnsxb.afrihall.com) ==="
          echo | timeout 10 openssl s_client -connect 141.95.112.93:443 -servername vpnsxb.afrihall.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates
          echo "=== Bannières SSH côté public (attendues par JSch) ==="
          for p in 22 444 443 8443; do
            echo "--- port $p ---"
            timeout 6 bash -c "exec 3<>/dev/tcp/141.95.112.93/$p && head -c 80 <&3" 2>&1
            echo ""
          done
          echo "=== ssh-keyscan public 22/444/443 ==="
          for p in 22 444 443; do
            echo "--- keyscan :$p ---"
            ssh-keyscan -T 5 -p $p 141.95.112.93 2>&1 | awk '{print $1, $2, substr($3,1,24)"…"}'
          done
          echo "=== HTTP santé publics ==="
          curl -s --max-time 8 -o /dev/null -w "dashboard / -> HTTP %{http_code}\n" https://vpnsxb.afrihall.com/
          curl -s --max-time 8 https://vpnsxb.afrihall.com/api/health
          echo
          curl -s --max-time 8 -o /dev/null -w "8443 /api/v1/ping -> HTTP %{http_code}\n" https://vpnsxb.afrihall.com:8443/api/v1/ping
          echo "════════════════ FIN SONDES PUBLIQUES ════════════════"
          } | tee audit-public.log
          exit 0

      - name: Install sshpass (auth par mot de passe sans interaction)
        run: sudo apt-get install -y sshpass >/dev/null 2>&1 && echo SSHPASS_OK

      - name: Audit interne VPS en lecture seule
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set +e
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=12 \
            -o NumberOfPasswordPrompts=1 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p 22 ubuntu@141.95.112.93 'bash -s' \
            < scripts/ci-patches/audit-remote.sh 2>&1 | tee audit-internal.log
          echo "(fin SSH, rc=${PIPESTATUS[0]})" | tee -a audit-internal.log
          exit 0   # l'audit ne doit jamais faire échouer le workflow

      - name: Relais git (secours) — diagnostics capturés
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
          git config user.name  "sxb-audit-relais"
          git config user.email "sxb-audit-relais@users.noreply.github.com"
          OUT="audit-runs/${GITHUB_RUN_ID}-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$OUT"
          cp audit-public.log audit-internal.log "$OUT/" 2>&1
          git add -f "$OUT" 2>&1   # -f : .gitignore contient *.log (cause de l'échec v2/v3)
          git commit -m "chore(audit): relais rapport masqué run ${GITHUB_RUN_ID} [auto — à purger avant merge]" 2>&1
          git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1
          } > relais-git.log 2>&1 || true
          echo "── relais-git.log ──"; cat relais-git.log || true

      - name: Relais principal — rapport complet en commentaires d'issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return `(fichier ${p} absent)`; } };
            const CHUNK = 60000; // < limite GitHub de 65536 caractères/commentaire

            // 1) Sommaire dans l'issue (recherche de l'issue [AUDIT] ouverte, sinon création)
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: '', per_page: 30,
            });
            let issue = issues.data.find(i => i.title.startsWith('[AUDIT]'));
            if (!issue) {
              issue = (await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `[AUDIT] rapports masqués (auto — à clôturer)`,
                body: `Accumulation des rapports d'audit lecture-seule (commentaires). Run initial : ${process.env.GITHUB_RUN_ID}.`,
              })).data;
            }

            // 2) Sommaire court en premier commentaire du run
            const diag = read('relais-git.log');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
              body: `### Run ${process.env.GITHUB_RUN_ID} — ${new Date().toISOString()}\n\n**Relais git :**\n\`\`\`\n${diag.slice(0, 1500)}\n\`\`\`\n\nLe rapport complet suit en commentaires (découpé par blocs de ${CHUNK} caractères).`,
            });

            // 3) Rapport complet en chunks (1 commentaire par bloc)
            const full = `## audit-public.log (runner = ce que voit le téléphone)\n\n${read('audit-public.log')}` +
                         `\n\n## audit-internal.log (audit VPS lecture seule)\n\n${read('audit-internal.log')}`;
            const total = Math.ceil(full.length / CHUNK);
            for (let i = 0; i < total && i < 12; i++) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `#### [${i + 1}/${total}] run ${process.env.GITHUB_RUN_ID}\n\`\`\`\n${full.slice(i * CHUNK, (i + 1) * CHUNK)}\n\`\`\``,
              });
            }

      - name: Purger les secrets de session
        if: always()
        run: rm -f ~/.ssh/known_hosts && echo OK
