name: Production application reset - OWNER only

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Inventory is non-destructive; reset deletes dashboard data after a private backup."
        type: choice
        options:
          - inventory
          - reset
        default: inventory
        required: true
      confirmation:
        description: "For reset only, type RESET SXB VPN. OWNER, ADMIN and SUPER_ADMIN accounts are preserved."
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  reset:
    name: Inventory or explicitly confirmed application reset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Validate the explicit operation
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          case "$ACTION" in inventory|reset) ;; *) exit 1 ;; esac
          if [ "$ACTION" = reset ]; then test "$CONFIRMATION" = "RESET SXB VPN"; fi
          : "${OWNER_EMAIL:?Missing authorized OWNER identity}"
          : "${OWNER_PASSWORD:?Missing authorized OWNER password}"

      - name: Call the protected API on the deployed version
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          SXB_RESET_ACTION: ${{ inputs.action }}
          SXB_RESET_CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_DEPLOYED_SHA: ${{ github.sha }}
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 60s
          command_timeout: 15m
          envs: OWNER_EMAIL,OWNER_PASSWORD,SXB_RESET_ACTION,SXB_RESET_CONFIRMATION,EXPECTED_DEPLOYED_SHA
          script: |
            set -euo pipefail
            cd /var/www/sxb-vpn
            test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOYED_SHA"
            test -f scripts/production-reset-ops.cjs
            echo "Disk allocation before operation:"
            df -B1 /var/www/sxb-vpn | tail -1
            node scripts/production-reset-ops.cjs "$SXB_RESET_ACTION"
            echo "Disk allocation after operation (database pages may remain reusable rather than shrink):"
            df -B1 /var/www/sxb-vpn | tail -1
