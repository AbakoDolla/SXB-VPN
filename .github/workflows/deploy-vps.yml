name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - "artifacts/sxb-dashboard/**"
      - "server.ts"
      - "server/**"
      - "prisma/**"
      - "scripts/prod/backup-sxb.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "ecosystem.config.cjs"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '141.95.112.93' }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY VPS_SSH_PASSPHRASE VPS_HOST_FINGERPRINT; do
            [ -n "${!name:-}" ] || { echo "::error::$name is not configured"; exit 1; }
          done
          if [ -n "${VPS_PORT:-}" ] && ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::VPS_PORT must be numeric"
            exit 1
          fi
          if [[ "$VPS_SSH_KEY" != *"BEGIN OPENSSH PRIVATE KEY"* && "$VPS_SSH_KEY" != *"BEGIN RSA PRIVATE KEY"* && "$VPS_SSH_KEY" != *"BEGIN EC PRIVATE KEY"* ]]; then
            echo "::error::VPS_SSH_KEY must contain a private key"
            exit 1
          fi
          if ! [[ "$VPS_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::error::VPS_HOST_FINGERPRINT must be an SHA256 fingerprint"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://127.0.0.1:5432/sxb_ci"

      - name: Validate release
        run: |
          set -euo pipefail
          pnpm run test
          pnpm run build
          bash -n scripts/prod/backup-sxb.sh
          test -s dist/server.cjs
          test -s artifacts/sxb-dashboard/dist/public/index.html

      - name: Read-only VPS preflight
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '141.95.112.93' }}
          username: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            APP_DIR="/var/www/sxb-vpn"
            test -d "$APP_DIR/.git"
            test -f "$APP_DIR/.env"
            command -v git >/dev/null
            command -v node >/dev/null
            command -v pg_dump >/dev/null
            command -v pm2 >/dev/null
            command -v curl >/dev/null
            node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
            test "$(df -Pk "$APP_DIR" | awk 'NR == 2 {print $4}')" -ge 2097152
            pm2 describe sxb-backend >/dev/null
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/api/health >/dev/null

      - name: Backup, deploy and verify
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST || '141.95.112.93' }}
          username: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA
          script_stop: true
          command_timeout: 25m
          script: |
            set -Eeuo pipefail
            umask 077

            APP_DIR="/var/www/sxb-vpn"
            RELEASES_DIR="$APP_DIR/releases"
            RELEASE_DIR="$RELEASES_DIR/$DEPLOY_SHA"
            CURRENT_LINK="$APP_DIR/current"
            DASHBOARD_STAGE="$APP_DIR/.deploy/dashboard-$DEPLOY_SHA"
            OLD_CURRENT="$(readlink -f "$CURRENT_LINK" 2>/dev/null || true)"
            LEGACY_ECOSYSTEM="$APP_DIR/ecosystem.config.cjs"
            DASHBOARD_PUBLISHED=0
            BACKEND_PUBLISHED=0

            probe() {
              local url="$1"
              local attempts="${2:-12}"
              local delay="${3:-5}"
              local i
              for ((i = 1; i <= attempts; i++)); do
                if curl --fail --silent --show-error --max-time 10 "$url" >/dev/null; then
                  return 0
                fi
                sleep "$delay"
              done
              return 1
            }

            rollback() {
              local status="$1"
              trap - ERR
              set +e
              echo "Deployment failed; restoring the previous release"

              if [ "$BACKEND_PUBLISHED" -eq 1 ]; then
                if [ -n "$OLD_CURRENT" ] && [ -d "$OLD_CURRENT" ]; then
                  ln -sfn "$OLD_CURRENT" "$CURRENT_LINK.rollback"
                  mv -Tf "$CURRENT_LINK.rollback" "$CURRENT_LINK"
                  pm2 startOrReload "$OLD_CURRENT/ecosystem.config.cjs" --update-env
                else
                  rm -f "$CURRENT_LINK"
                  pm2 startOrReload "$LEGACY_ECOSYSTEM" --update-env
                fi
                pm2 save
              fi

              if [ "$DASHBOARD_PUBLISHED" -eq 1 ] && [ -n "${BACKUP_DIR:-}" ]; then
                tar -xzf "$BACKUP_DIR/runtime-dist.tar.gz" -C "$APP_DIR"
              fi

              probe http://127.0.0.1:3000/api/health 6 5 || true
              exit "$status"
            }
            trap 'rollback $?' ERR

            cd "$APP_DIR"
            mkdir -p "$RELEASES_DIR" "$APP_DIR/.deploy"
            git fetch --filter=blob:none origin main
            git cat-file -e "$DEPLOY_SHA^{commit}"

            BACKUP_SCRIPT="$(mktemp)"
            git show "$DEPLOY_SHA:scripts/prod/backup-sxb.sh" > "$BACKUP_SCRIPT"
            chmod 700 "$BACKUP_SCRIPT"
            SXB_APP_DIR="$APP_DIR" "$BACKUP_SCRIPT"
            rm -f "$BACKUP_SCRIPT"

            BACKUP_DIR="$(readlink -f "$HOME/sxb-backups/latest")"
            test -s "$BACKUP_DIR/manifest.sha256"
            test -s "$BACKUP_DIR/db.dump"
            test -s "$BACKUP_DIR/runtime-dist.tar.gz"
            (cd "$BACKUP_DIR" && sha256sum --check manifest.sha256)

            if ! git diff --quiet --ignore-submodules -- || ! git diff --cached --quiet --ignore-submodules --; then
              echo "Tracked production changes were backed up; deployment stopped for manual reconciliation"
              exit 1
            fi

            rm -rf "$RELEASE_DIR" "$DASHBOARD_STAGE"
            mkdir -p "$RELEASE_DIR" "$DASHBOARD_STAGE"
            git archive "$DEPLOY_SHA" | tar -x -C "$RELEASE_DIR"

            cd "$RELEASE_DIR"
            corepack enable
            corepack prepare pnpm@11.25.0 --activate
            pnpm install --frozen-lockfile
            DATABASE_URL="postgresql://127.0.0.1:5432/sxb_build" \
              pnpm exec prisma generate --schema=prisma/schema.prisma
            pnpm --filter sxb-dashboard run build
            pnpm run build:backend

            test -s "$RELEASE_DIR/dist/server.cjs"
            test -s "$RELEASE_DIR/artifacts/sxb-dashboard/dist/public/index.html"
            cp -a "$RELEASE_DIR/artifacts/sxb-dashboard/dist/public/." "$DASHBOARD_STAGE/"

            set -a
            # shellcheck disable=SC1091
            . "$APP_DIR/.env"
            set +a

            PGLIB_URL="$(printf '%s' "$DATABASE_URL" | sed -E 's/([?&])schema=[^&]*&?/\1/; s/[?&]$//')"
            MIGRATIONS_TABLE="$(psql "$PGLIB_URL" -Atqc "SELECT to_regclass('public._prisma_migrations') IS NOT NULL;")"
            if [ "$MIGRATIONS_TABLE" != "t" ]; then
              set +e
              pnpm exec prisma migrate diff \
                --from-schema-datasource prisma/schema.prisma \
                --to-schema-datamodel prisma/schema.prisma \
                --exit-code
              DIFF_STATUS=$?
              set -e
              if [ "$DIFF_STATUS" -ne 0 ]; then
                echo "The existing database does not exactly match the migration baseline"
                exit 1
              fi
              pnpm exec prisma migrate resolve \
                --schema=prisma/schema.prisma \
                --applied=20260902000000_baseline
            fi
            pnpm exec prisma migrate deploy --schema=prisma/schema.prisma

            mkdir -p "$APP_DIR/dist"
            for entry in "$DASHBOARD_STAGE"/*; do
              [ "$(basename "$entry")" = "index.html" ] && continue
              cp -a "$entry" "$APP_DIR/dist/"
            done
            install -m 644 "$DASHBOARD_STAGE/index.html" "$APP_DIR/dist/index.html.next"
            mv -f "$APP_DIR/dist/index.html.next" "$APP_DIR/dist/index.html"
            DASHBOARD_PUBLISHED=1

            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK.next"
            mv -Tf "$CURRENT_LINK.next" "$CURRENT_LINK"
            BACKEND_PUBLISHED=1
            pm2 startOrReload "$RELEASE_DIR/ecosystem.config.cjs" --update-env

            probe http://127.0.0.1:3000/api/health
            probe https://vpnsxb.afrihall.com/
            probe https://vpnsxb.afrihall.com/api/health
            pm2 describe sxb-backend >/dev/null
            test -n "$(pm2 pid sxb-backend)"
            test "$(pm2 pid sxb-backend)" != "0"
            pm2 save

            cd "$APP_DIR"
            printf '%s\n' "$DEPLOY_SHA" > "$APP_DIR/.last-deployed-sha"
            for pattern in /current /releases/ /.deploy/ /.last-deployed-sha; do
              grep -qxF "$pattern" .git/info/exclude || printf '%s\n' "$pattern" >> .git/info/exclude
            done

            trap - ERR
            rm -rf "$DASHBOARD_STAGE"
            find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -nr \
              | awk 'NR > 3 {$1=""; sub(/^ /, ""); print}' \
              | while IFS= read -r old_release; do
                  [ "$(readlink -f "$CURRENT_LINK")" = "$old_release" ] || rm -rf "$old_release"
                done

            echo "Deployment $DEPLOY_SHA completed and verified"
