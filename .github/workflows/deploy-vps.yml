name: 🚀 Deploy to VPS — SXB VPN

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/sxb-dashboard/**'
      - 'backend/**'
      - 'server/**'
      - 'server.ts'
      - 'prisma/**'
      - '.github/workflows/deploy-vps.yml'
      - 'ecosystem.config.cjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vpnsxb.afrihall.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production SSH secrets
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
          VPS_SSH_HOST_FINGERPRINT: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for secret_name in VPS_SSH_PRIVATE_KEY VPS_SSH_PASSPHRASE VPS_SSH_HOST_FINGERPRINT; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Secret d'environnement production manquant: $secret_name"
              exit 1
            fi
          done
          if [[ ! "$VPS_SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::error::VPS_SSH_HOST_FINGERPRINT doit être une empreinte SHA256 OpenSSH"
            exit 1
          fi

      - name: Verify VPS access (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 30s
          script_stop: true
          script: |
            set -euo pipefail
            test "$(id -un)" = "ubuntu"
            test -r /var/www/sxb-vpn/.git/HEAD
            test "$(git -C /var/www/sxb-vpn rev-parse --is-inside-work-tree)" = "true"
            git -C /var/www/sxb-vpn rev-parse --verify HEAD >/dev/null
            echo "✅ Accès SSH vérifié en lecture seule"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Approve build scripts
        run: |
          pnpm config set ignore-build-scripts true 2>/dev/null || true

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Dashboard (React + Vite)
        working-directory: artifacts/sxb-dashboard
        env:
          PORT: '3000'
          BASE_PATH: '/'
          NODE_ENV: production
        run: pnpm run build

      - name: Build Backend (esbuild CJS bundle)
        run: |
          pnpm --filter @workspace/api-spec run codegen 2>/dev/null || true
          mkdir -p dist
          # esbuild n'est pas à la racine du workspace — installer les deps backend d'abord
          cd backend && npm install --legacy-peer-deps --no-audit --silent 2>&1 | tail -3 && cd ..
          # Utiliser l'esbuild du backend
          ESBUILD=$(find backend/node_modules/.bin -name "esbuild" -executable | head -1)
          if [ -z "$ESBUILD" ]; then
            # Fallback: npx
            ESBUILD="npx --yes esbuild@0.27.3"
          fi
          echo "esbuild: $ESBUILD"
          $ESBUILD server.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --packages=external \
            --sourcemap \
            --outfile=dist/server.cjs
          echo "✅ Backend built: $(du -sh dist/server.cjs | cut -f1)"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 30s
          script_stop: true
          script: |
            set -e
            cd /var/www/sxb-vpn

            echo "📥 Fix permissions git + Pull latest code..."
            sudo chown -R ubuntu:ubuntu /var/www/sxb-vpn/.git 2>/dev/null || true
            sudo chmod -R u+rw /var/www/sxb-vpn/.git 2>/dev/null || true

            # Le VPS tirait le code avec SES propres identifiants GitHub, qui ont
            # expiré : `git fetch` échoue en HTTP 401. Comme l'échec était absorbé
            # par un `|| true`, `git reset --hard origin/main` se calait ensuite
            # sur la référence LOCALE périmée et réussissait. Le déploiement
            # rapportait donc « succès » tout en reconstruisant l'ancien code, et
            # la production est restée bloquée plusieurs commits en arrière sans
            # la moindre alerte.
            #
            # Le jeton du workflow est désormais utilisé pour l'authentification :
            # il est valable le temps de l'exécution et n'est jamais écrit sur le
            # disque du VPS (`-c` ne modifie pas la configuration persistante).
            # Le déploiement ne dépend donc plus d'identifiants stockés là-bas.
            if ! git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' '${{ secrets.GITHUB_TOKEN }}' | base64 -w0)" \
                 fetch origin main; then
              echo "❌ git fetch a échoué — déploiement interrompu"
              exit 1
            fi
            git reset --hard FETCH_HEAD

            # Garde-fou : la version déployée DOIT être celle qui a déclenché ce
            # workflow. Sans ce contrôle, toute divergence repasse inaperçue.
            DEPLOYED_SHA=$(git rev-parse HEAD)
            if [ "$DEPLOYED_SHA" != "${{ github.sha }}" ]; then
              echo "❌ Version déployée ($DEPLOYED_SHA) ≠ version attendue (${{ github.sha }})"
              exit 1
            fi
            echo "✅ Code à jour : $DEPLOYED_SHA"

            echo "📦 Install backend dependencies..."
            cd backend
            npm install --legacy-peer-deps --no-audit 2>&1 | tail -3
            # Generate the client in backend/node_modules, which is the directory
            # PM2 resolves through NODE_PATH at runtime. Generating from /tmp
            # leaves the deployed client without runtime/library.js.
            NODE_PATH=/var/www/sxb-vpn/backend/node_modules \
              node /var/www/sxb-vpn/backend/node_modules/prisma/build/index.js generate \
              --schema=/var/www/sxb-vpn/backend/prisma/schema.prisma
            test -f /var/www/sxb-vpn/backend/node_modules/@prisma/client/runtime/library.js
            cd /var/www/sxb-vpn

            echo "🔑 Fix permissions complètes (évite EACCES pnpm)..."
            sudo chown -R ubuntu:ubuntu /var/www/sxb-vpn/ 2>/dev/null || true
            echo "📦 Sync deps (lockfile may differ from VPS)..."
            pnpm config set ignore-build-scripts true 2>/dev/null || true
            pnpm install --no-frozen-lockfile --ignore-scripts 2>&1 | tail -5

            echo "🎨 Build Dashboard..."
            sudo chown -R ubuntu:ubuntu /var/www/sxb-vpn/artifacts/ 2>/dev/null || true
            CI=true PORT=3000 BASE_PATH=/ pnpm --filter @workspace/sxb-dashboard run build
            # Nginx sert /var/www/sxb-vpn/dist, tandis que Vite écrit dans
            # artifacts/sxb-dashboard/dist/public. Copier explicitement le
            # bundle frontend sans supprimer server.cjs ni download/*.apk.
            test -f artifacts/sxb-dashboard/dist/public/index.html
            rm -rf dist/assets
            cp -a artifacts/sxb-dashboard/dist/public/assets dist/assets
            cp -f artifacts/sxb-dashboard/dist/public/index.html dist/index.html
            for asset in favicon.svg favicon.png robots.txt; do
              if [ -f "artifacts/sxb-dashboard/dist/public/$asset" ]; then
                cp -f "artifacts/sxb-dashboard/dist/public/$asset" "dist/$asset"
              fi
            done
            echo "✅ Dashboard bundle synchronized to dist/"

            echo "⚙️ Build Backend..."
            ESBUILD=$(find backend/node_modules/.bin -name "esbuild" -executable | head -1)
            if [ -z "$ESBUILD" ]; then ESBUILD="npx --yes esbuild@0.27.3"; fi
            $ESBUILD server.ts \
              --bundle \
              --platform=node \
              --format=cjs \
              --packages=external \
              --sourcemap \
              --outfile=dist/server.cjs

            echo "🗄️ Push Prisma schema..."
            DB_URL=$(grep DATABASE_URL .env | cut -d= -f2-)
            NODE_PATH=/var/www/sxb-vpn/backend/node_modules \
              node /var/www/sxb-vpn/backend/node_modules/prisma/build/index.js db push \
              --schema=backend/prisma/schema.prisma \
              --accept-data-loss 2>&1 | tail -5

            echo "🔄 Reload PM2..."
            pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs

            echo "🔄 Reload Nginx..."
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Deployment complete!"
            pm2 list

      - name: Validate production
        run: |
          sleep 10
          echo "=== Frontend ==="
          INDEX=$(curl -fsSL https://vpnsxb.afrihall.com/)
          HTTP=$(printf '%s' "$INDEX" | wc -c)
          echo "Frontend index bytes $HTTP"
          [ "$HTTP" -gt 500 ] || (echo "❌ Frontend index too small" && exit 1)
          ASSET=$(printf '%s' "$INDEX" | grep -oE 'assets/[^\" ]+\.js' | head -1)
          [ -n "$ASSET" ] || (echo "❌ Frontend JS asset missing" && exit 1)
          JS=$(curl -fsSL "https://vpnsxb.afrihall.com/$ASSET")
          printf '%s' "$JS" | grep -q 'V2Ray / Xray' || (echo "❌ New Xray editor marker missing from live bundle" && exit 1)
          printf '%s' "$JS" | grep -q 'Valider le transport' || (echo "❌ New transport validation marker missing from live bundle" && exit 1)
          echo "✅ Frontend bundle verified: $ASSET"

          echo "=== API health ==="
          # Accepte 200/400/401/403/422 — toute réponse HTTP valide du serveur
          # (400 = bad request pour creds invalides = serveur UP)
          API=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://vpnsxb.afrihall.com/xapi/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test","password":"test"}')
          echo "API HTTP $API"
          case "$API" in
            200|400|401|403|422)
              echo "✅ API up (HTTP $API — réponse valide du serveur)" ;;
            000)
              echo "❌ API unreachable (timeout/DNS)" && exit 1 ;;
            502|503|504)
              echo "❌ API down (gateway error $API)" && exit 1 ;;
            *)
              echo "⚠️  API HTTP $API — considéré OK (pas une erreur réseau)" ;;
          esac
          echo "✅ Production OK"
