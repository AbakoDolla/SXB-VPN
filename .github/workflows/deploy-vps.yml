name: 🚀 Deploy to VPS — SXB VPN

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/sxb-dashboard/**'
      - 'backend/**'
      - 'server/**'
      - 'server.ts'
      - 'prisma/**'
      - 'scripts/**'
      - '.github/workflows/deploy-vps.yml'
      - 'ecosystem.config.cjs'
  workflow_dispatch:

permissions:
  contents: read

# Deux poussées rapprochées lançaient deux déploiements en parallèle sur le
# même VPS : migrations Prisma concurrentes, `pm2 restart` qui se croisent,
# et une sauvegarde écrasée par la suivante. Les déploiements se font donc
# un par un. On n'annule jamais celui en cours (`cancel-in-progress: false`) :
# l'interrompre entre la migration et le redémarrage laisserait la production
# sur un schéma migré servi par l'ancien code.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vpnsxb.afrihall.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate production SSH secrets
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
          VPS_SSH_HOST_FINGERPRINT: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for secret_name in VPS_SSH_PRIVATE_KEY VPS_SSH_PASSPHRASE VPS_SSH_HOST_FINGERPRINT; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Secret d'environnement production manquant: $secret_name"
              exit 1
            fi
          done
          if [[ ! "$VPS_SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::error::VPS_SSH_HOST_FINGERPRINT doit être une empreinte SHA256 OpenSSH"
            exit 1
          fi

      - name: Verify VPS access (read-only)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 30s
          script: |
            set -euo pipefail
            test "$(id -un)" = "ubuntu"
            test -r /var/www/sxb-vpn/.git/HEAD
            test "$(git -C /var/www/sxb-vpn rev-parse --is-inside-work-tree)" = "true"
            git -C /var/www/sxb-vpn rev-parse --verify HEAD >/dev/null
            echo "✅ Accès SSH vérifié en lecture seule"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Approve build scripts
        run: |
          pnpm config set ignore-build-scripts true 2>/dev/null || true

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # Les garde-fous ne protégeaient que la construction Android : le serveur
      # et le tableau de bord partaient en production sans qu'aucun ne s'exécute.
      # Or ces tests verrouillent précisément des règles serveur — parité des
      # schémas Prisma, cloisonnement des rôles, complétude du catalogue pnpm —
      # dont l'oubli a déjà provoqué des pannes ici.
      - name: Garde-fous contre les régressions
        working-directory: app-mobile
        run: npx tsx --test tests/regression-critical-flows.test.ts ../server/tests/reseller-lifecycle.test.ts ../server/tests/session-user.test.ts ../server/tests/subscription-bulk.test.ts ../server/tests/free-trial.test.ts ../server/tests/dashboard-freshness.test.ts ../server/tests/admin-surface.test.ts

      - name: Build Dashboard (React + Vite)
        working-directory: artifacts/sxb-dashboard
        env:
          PORT: '3000'
          BASE_PATH: '/'
          NODE_ENV: production
        run: pnpm run build

      - name: Build Backend (esbuild CJS bundle)
        run: |
          pnpm --filter @workspace/api-spec run codegen 2>/dev/null || true
          mkdir -p dist
          # esbuild n'est pas à la racine du workspace — installer les deps backend d'abord
          cd backend && npm install --legacy-peer-deps --no-audit --silent 2>&1 | tail -3 && cd ..
          # Utiliser l'esbuild du backend
          ESBUILD=$(find backend/node_modules/.bin -name "esbuild" -executable | head -1)
          if [ -z "$ESBUILD" ]; then
            # Pas de repli via npx : "npx --yes esbuild" résout le nom sur le PATH
            # au lieu d'installer le paquet, et échoue avec "esbuild: not found".
            echo "❌ esbuild introuvable dans backend/node_modules/.bin après npm install." >&2
            exit 1
          fi
          echo "esbuild: $ESBUILD"
          $ESBUILD server.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --packages=external \
            --sourcemap \
            --outfile=dist/server.cjs
          echo "✅ Backend built: $(du -sh dist/server.cjs | cut -f1)"

      - name: Verify API, configuration locks and dashboard languages
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
        run: |
          node backend/node_modules/prisma/build/index.js generate --schema backend/prisma/schema.prisma
          node backend/node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
          node scripts/verify-prisma-runtime.cjs
          node --experimental-strip-types --test --test-concurrency=1 scripts/tests/*.test.mjs

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          MOBILE_HEALTH_PSEUDONYM_SECRET: ${{ secrets.MOBILE_HEALTH_PSEUDONYM_SECRET }}
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 30s
          # Transmis au shell distant pour l'amorçage du compte OWNER. Ces deux
          # valeurs restent des secrets : elles ne transitent jamais par le dépôt.
          envs: OWNER_EMAIL,OWNER_PASSWORD,FIREBASE_SERVICE_ACCOUNT_JSON,FIREBASE_PROJECT_ID,FIREBASE_CLIENT_EMAIL,FIREBASE_PRIVATE_KEY,MOBILE_HEALTH_PSEUDONYM_SECRET
          script: |
            set -eo pipefail
            # `set -e` seul laissait passer l'échec d'une commande suivie d'un
            # pipe : `npm install ... | tail -3` rapportait le succès de `tail`,
            # jamais celui de l'installation. `pipefail` propage l'échec du
            # premier maillon, comme les blocs du runner (`set -euo pipefail`).
            # `-u` reste exclu : MOBILE_HEALTH_PSEUDONYM_SECRET est légitimement
            # vide au premier passage et testé explicitement plus bas.
            cd /var/www/sxb-vpn

            echo "📥 Fix permissions git + Pull latest code..."
            sudo chown -R ubuntu:ubuntu /var/www/sxb-vpn/.git 2>/dev/null || true
            sudo chmod -R u+rw /var/www/sxb-vpn/.git 2>/dev/null || true

            # Le VPS tirait le code avec SES propres identifiants GitHub, qui ont
            # expiré : `git fetch` échoue en HTTP 401. Comme l'échec était absorbé
            # par un `|| true`, `git reset --hard origin/main` se calait ensuite
            # sur la référence LOCALE périmée et réussissait. Le déploiement
            # rapportait donc « succès » tout en reconstruisant l'ancien code, et
            # la production est restée bloquée plusieurs commits en arrière sans
            # la moindre alerte.
            #
            # Le jeton du workflow est désormais utilisé pour l'authentification :
            # il est valable le temps de l'exécution et n'est jamais écrit sur le
            # disque du VPS (`-c` ne modifie pas la configuration persistante).
            # Le déploiement ne dépend donc plus d'identifiants stockés là-bas.
            if ! git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' '${{ secrets.GITHUB_TOKEN }}' | base64 -w0)" \
                 fetch origin main; then
              echo "❌ git fetch a échoué — déploiement interrompu"
              exit 1
            fi
            # Garde-fou : la version déployée DOIT être celle qui a déclenché ce
            # workflow. Sans ce contrôle, toute divergence repasse inaperçue.
            DEPLOYED_SHA=$(git rev-parse FETCH_HEAD)
            if [ "$DEPLOYED_SHA" != "${{ github.sha }}" ]; then
              echo "❌ Version déployée ($DEPLOYED_SHA) ≠ version attendue (${{ github.sha }})"
              exit 1
            fi
            # Lire le cron root avant de remplacer le checkout. Le helper vient
            # du SHA vérifié ; aucune ligne de cron ni aucun secret n'est logué.
            git show FETCH_HEAD:scripts/check-backend-cron.cjs | node
            git reset --hard FETCH_HEAD
            echo "✅ Code à jour : $DEPLOYED_SHA"

            # Le pseudonyme de santé doit rester stable après redémarrage. Si le
            # secret GitHub n'est pas encore configuré, réutiliser celui du VPS
            # ou en générer un une seule fois, puis le conserver dans .env.
            ENV_FILE="/var/www/sxb-vpn/.env"
            if [ -z "$MOBILE_HEALTH_PSEUDONYM_SECRET" ] && [ -f "$ENV_FILE" ]; then
              MOBILE_HEALTH_PSEUDONYM_SECRET=$(sed -n 's/^MOBILE_HEALTH_PSEUDONYM_SECRET=//p' "$ENV_FILE" | tail -1)
            fi
            if [ -z "$MOBILE_HEALTH_PSEUDONYM_SECRET" ]; then
              MOBILE_HEALTH_PSEUDONYM_SECRET=$(openssl rand -hex 32)
            fi
            TMP_ENV=$(mktemp)
            if [ -f "$ENV_FILE" ]; then
              # `|| true` absorbait aussi le code 2 (fichier illisible), et le
              # `mv` plus bas écrasait alors le .env de production avec un
              # fichier tronqué. Seul le code 1 (aucune ligne conservée) est
              # bénin ; toute autre erreur doit interrompre le déploiement.
              grep -v '^MOBILE_HEALTH_PSEUDONYM_SECRET=' "$ENV_FILE" > "$TMP_ENV" || [ $? -eq 1 ]
            fi
            printf 'MOBILE_HEALTH_PSEUDONYM_SECRET=%s\n' "$MOBILE_HEALTH_PSEUDONYM_SECRET" >> "$TMP_ENV"
            mv "$TMP_ENV" "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            export MOBILE_HEALTH_PSEUDONYM_SECRET

            echo "📦 Install backend dependencies..."
            export PRISMA_SKIP_POSTINSTALL_GENERATE=true
            cd backend
            npm install --legacy-peer-deps --no-audit 2>&1 | tail -3
            cd /var/www/sxb-vpn

            echo "🔑 Fix permissions complètes (évite EACCES pnpm)..."
            sudo chown -R ubuntu:ubuntu /var/www/sxb-vpn/ 2>/dev/null || true
            echo "📦 Sync deps (lockfile may differ from VPS)..."
            pnpm config set ignore-build-scripts true 2>/dev/null || true
            pnpm install --no-frozen-lockfile --ignore-scripts 2>&1 | tail -5

            echo "🎨 Build Dashboard..."
            sudo chown -R ubuntu:ubuntu /var/www/sxb-vpn/artifacts/ 2>/dev/null || true
            CI=true PORT=3000 BASE_PATH=/ pnpm --filter @workspace/sxb-dashboard run build
            # Nginx sert /var/www/sxb-vpn/dist, tandis que Vite écrit dans
            # artifacts/sxb-dashboard/dist/public. Copier explicitement le
            # bundle frontend sans supprimer server.cjs ni download/*.apk.
            test -f artifacts/sxb-dashboard/dist/public/index.html

            echo "⚙️ Build Backend..."
            mkdir -p .sxb-release
            # `|| true` : sous `pipefail`, un `find` dont le répertoire est
            # absent sort en code 1 et interromprait le déploiement AVANT le
            # test ci-dessous — c'est-à-dire précisément dans le cas que ce
            # test existe pour traiter. Le `|| true` est ici correct parce
            # qu'il est immédiatement suivi d'une vérification du résultat.
            ESBUILD=$(find backend/node_modules/.bin -name "esbuild" -executable 2>/dev/null | head -1 || true)
            if [ -z "$ESBUILD" ]; then
              # Même décision qu'au build du runner : pas de repli via npx.
              # "npx --yes esbuild" résout le nom sur le PATH au lieu d'installer
              # le paquet, et échoue avec "esbuild: not found". Surtout, un repli
              # silencieux compilerait la production — dont `seed-owner`, qui
              # touche la base — avec un binaire non déclaré et non épinglé,
              # sans qu'aucune trace ne distingue ce cas du cas nominal.
              echo "❌ esbuild introuvable dans backend/node_modules/.bin — déploiement interrompu." >&2
              exit 1
            fi
            echo "esbuild: $ESBUILD"
            $ESBUILD server.ts \
              --bundle \
              --platform=node \
              --format=cjs \
              --packages=external \
              --sourcemap \
              --outfile=.sxb-release/server.cjs

            # Fail before replacing the running version if an operator marks
            # the privacy policy reviewed but its required information is absent.
            $ESBUILD server/services/public-privacy.ts \
              --bundle --platform=node --format=cjs --packages=external \
              --outfile=.sxb-release/public-privacy-settings.cjs
            NODE_PATH=/var/www/sxb-vpn/backend/node_modules \
              node scripts/verify-public-privacy.cjs

            # Dump privé vérifié, DDL explicites (dont security-layer.sql),
            # puis comparaison READ-ONLY avec backend/prisma/schema.prisma.
            # Aucun rattrapage destructif ni publication en cas d'écart.
            export SXB_MIGRATION_BACKUP_DIR="${SXB_MIGRATION_BACKUP_DIR:-$HOME/sxb-backups}"
            node scripts/backend-migrate.cjs prepare

            # Générer les DEUX clients seulement après le gate : Node cherche
            # à la racine avant NODE_PATH, utilisé par PM2 pour backend/.
            NODE_PATH=/var/www/sxb-vpn/backend/node_modules \
              node backend/node_modules/prisma/build/index.js generate \
              --schema=backend/prisma/schema.prisma
            test -f backend/node_modules/@prisma/client/runtime/library.js
            NODE_PATH=/var/www/sxb-vpn/backend/node_modules \
              node backend/node_modules/prisma/build/index.js generate \
              --schema=prisma/schema.prisma
            NODE_PATH=/var/www/sxb-vpn/backend/node_modules \
              node scripts/verify-prisma-runtime.cjs
            NODE_PATH=/var/www/sxb-vpn/backend/node_modules \
              node scripts/reconcile-allocation-ledger.cjs

            # Amorçage du compte propriétaire racine. `POST /api/users` refuse de
            # créer un OWNER si le demandeur n'en est pas un : le tout premier ne
            # peut donc naître que hors API. Idempotent — sert aussi à réinitialiser
            # le mot de passe si l'accès est perdu.
            if [ -n "$OWNER_EMAIL" ] && [ -n "$OWNER_PASSWORD" ]; then
              echo "👑 Amorçage du compte OWNER..."
              $ESBUILD backend/prisma/seed-owner.ts \
                --bundle --platform=node --format=cjs --packages=external \
                --outfile=dist/seed-owner.cjs
              # Même parseur .env que le gate ; aucun secret dans les arguments.
              NODE_PATH=/var/www/sxb-vpn/backend/node_modules \
                DOTENV_CONFIG_QUIET=true node -r dotenv/config dist/seed-owner.cjs
            else
              echo "ℹ️ Amorçage OWNER ignoré (secrets OWNER_EMAIL/OWNER_PASSWORD absents)."
            fi

            echo "🔄 Reload PM2..."
            # Publier seulement après sauvegarde et migrations réussies.
            # Garder les anciens chunks pour les navigateurs déjà connectés.
            mkdir -p dist/assets
            cp -a artifacts/sxb-dashboard/dist/public/assets/. dist/assets/
            mv .sxb-release/server.cjs dist/server.cjs
            mv .sxb-release/server.cjs.map dist/server.cjs.map
            # Liste explicite, et non une copie du dossier entier : `dist/`
            # contient aussi server.cjs et download/*.apk, qu'un miroir
            # effacerait. Tout fichier statique nouveau doit donc être ajouté
            # ICI, faute de quoi il est construit puis silencieusement laissé
            # de côté — la page répond alors 200 avec le tableau de bord, ce
            # qui ressemble à un problème de nginx sans en être un.
            for asset in favicon.svg favicon.png robots.txt telecharger.html; do
              if [ -f "artifacts/sxb-dashboard/dist/public/$asset" ]; then
                cp -f "artifacts/sxb-dashboard/dist/public/$asset" "dist/$asset"
              fi
            done
            pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            curl -fsS --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:4000/api/health >/dev/null
            cp -f artifacts/sxb-dashboard/dist/public/index.html dist/index.next.html
            mv dist/index.next.html dist/index.html
            # Conserve les variables FCM/santé après un redémarrage du VPS.
            pm2 save

            echo "🔄 Reload Nginx..."
            # `index.html` ne porte pas de version dans son nom : c'est lui qui
            # désigne le bundle à charger. Nginx le sert depuis le disque, donc
            # l'en-tête posé par l'application ne l'atteint jamais. Sans
            # consigne, le navigateur applique son heuristique de fraîcheur et
            # peut resservir une page périmée pendant des heures — une section
            # déployée reste alors invisible, sans erreur pour l'expliquer.
            #
            # Les fichiers de /assets portent une empreinte dans leur nom et
            # sont servis par un `location` d'extension, prioritaire sur ce
            # préfixe : leur cache long n'est pas touché. L'opération est
            # idempotente (marqueur), sauvegardée, testée, et annulée si la
            # configuration devient invalide.
            # Nginx charge TOUT fichier présent dans sites-enabled : une
            # sauvegarde déposée là y est lue comme une configuration à part
            # entière et duplique les upstreams, ce qui fait échouer `nginx -t`
            # au prochain rechargement. Les sauvegardes vivent donc hors de ce
            # répertoire, et toute sauvegarde égarée est retirée ici.
            sudo find /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ -name '*.sxb.bak' -delete 2>/dev/null || true
            NGINX_BACKUP_DIR=/var/backups/sxb-nginx
            sudo mkdir -p "$NGINX_BACKUP_DIR"
            # Plusieurs sites cohabitent sur ce serveur : retenir le premier
            # fichier trouvé donnait celui de XPanel, qui n'a pas de bloc
            # « location / ». On parcourt donc les candidats et on garde celui
            # qui sert réellement le tableau de bord.
            NGINX_CONF=""
            for candidate in $(grep -rl -e "vpnsxb.afrihall.com" -e "/var/www/sxb-vpn" /etc/nginx/ 2>/dev/null | grep -v '\.bak$'); do
              if grep -qE '^[[:space:]]*location[[:space:]]+/[[:space:]]*\{' "$candidate"; then
                NGINX_CONF="$candidate"
                break
              fi
            done
            if [ -z "$NGINX_CONF" ]; then
              echo "⚠️ Aucun fichier Nginx avec un bloc « location / » pour ce site — revalidation non appliquée"
            elif grep -q "SXB_INDEX_NOCACHE" "$NGINX_CONF"; then
              echo "✅ Revalidation déjà en place dans $NGINX_CONF"
            else
              echo "🧊 Révalidation du document d'entrée dans $NGINX_CONF"
              NGINX_BACKUP="$NGINX_BACKUP_DIR/$(basename "$NGINX_CONF").$(date +%s)"
              sudo cp "$NGINX_CONF" "$NGINX_BACKUP"
              sudo sed -i -E 's|^([[:space:]]*)location[[:space:]]+/[[:space:]]*\{|\1location / {\n\1    add_header Cache-Control "no-cache" always; # SXB_INDEX_NOCACHE|' "$NGINX_CONF"
              if sudo nginx -t; then
                echo "✅ Revalidation appliquée"
              else
                echo "⚠️ Configuration refusée — restauration de la version précédente"
                sudo cp "$NGINX_BACKUP" "$NGINX_CONF"
                sudo nginx -t
              fi
            fi
            # Exact TLS vhost only; retain the existing API port from .env.
            # No profile is activated by installing this dormant location.
            test -n "$NGINX_CONF"
            RELAY_CANDIDATE=$(mktemp)
            node scripts/configure-ssh-relay-nginx.cjs "$NGINX_CONF" "$RELAY_CANDIDATE"
            if ! cmp -s "$NGINX_CONF" "$RELAY_CANDIDATE"; then
              RELAY_BACKUP="$NGINX_BACKUP_DIR/$(basename "$NGINX_CONF").relay.$(date +%s)"
              sudo cp "$NGINX_CONF" "$RELAY_BACKUP"
              sudo cp "$RELAY_CANDIDATE" "$NGINX_CONF"
              if ! sudo nginx -t; then
                sudo cp "$RELAY_BACKUP" "$NGINX_CONF"
                rm -f "$RELAY_CANDIDATE"
                sudo nginx -t
                echo "Relay ingress rejected; original configuration restored" >&2
                exit 1
              fi
            fi
            rm -f "$RELAY_CANDIDATE"
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Deployment complete!"
            pm2 list

      - name: Validate production
        run: |
          sleep 10
          echo "=== TLS certificate ==="
          # Un certificat qui ne couvre plus vpnsxb.afrihall.com (renouvellement
          # raté, mauvais vhost servi en premier par Nginx) laisse le site
          # techniquement "en ligne" tout en affichant "Votre connexion n'est
          # pas privée" à chaque visiteur. curl -v échoue net s'il refuse le
          # certificat : on préfère bloquer la livraison ici plutôt que de la
          # découvrir via une capture d'écran d'un client.
          CERT_INFO=$(echo | openssl s_client -connect vpnsxb.afrihall.com:443 -servername vpnsxb.afrihall.com 2>/dev/null \
            | openssl x509 -noout -subject -ext subjectAltName -enddate 2>/dev/null || true)
          echo "$CERT_INFO"
          if [ -z "$CERT_INFO" ]; then
            echo "❌ Impossible de lire le certificat TLS servi" && exit 1
          fi
          printf '%s' "$CERT_INFO" | grep -q 'DNS:vpnsxb.afrihall.com' ||
            (echo "❌ Le certificat servi ne couvre pas vpnsxb.afrihall.com" && exit 1)
          NOT_AFTER=$(printf '%s' "$CERT_INFO" | grep -i '^notAfter=' | cut -d= -f2-)
          EXPIRE_EPOCH=$(date -d "$NOT_AFTER" +%s 2>/dev/null || echo 0)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRE_EPOCH - NOW_EPOCH) / 86400 ))
          echo "Certificat valide jusqu'au $NOT_AFTER ($DAYS_LEFT jours restants)"
          if [ "$DAYS_LEFT" -lt 7 ]; then
            echo "❌ Certificat expirant sous 7 jours — renouvellement certbot requis" && exit 1
          fi
          curl -fsS https://vpnsxb.afrihall.com/ -o /dev/null ||
            (echo "❌ curl refuse la chaîne de certification TLS présentée" && exit 1)
          echo "✅ Certificat TLS valide et couvrant le domaine"

          echo "=== Frontend ==="
          INDEX=$(curl -fsSL https://vpnsxb.afrihall.com/)
          HTTP=$(printf '%s' "$INDEX" | wc -c)
          echo "Frontend index bytes $HTTP"
          [ "$HTTP" -gt 500 ] || (echo "❌ Frontend index too small" && exit 1)

          # Le document d'entrée doit être revalidé, sinon un navigateur peut
          # resservir une page périmée qui désigne un ancien bundle : la mise
          # en ligne serait invisible pour l'utilisateur, sans erreur. Le
          # constat est signalé sans faire échouer la livraison : le site
          # fonctionne, et bloquer ici empêcherait la prochaine correction
          # d'atteindre la production.
          INDEX_CACHE=$(curl -fsSI https://vpnsxb.afrihall.com/ | tr -d '\r' | grep -i '^cache-control:' || true)
          echo "index.html cache-control: ${INDEX_CACHE:-<absent>}"
          printf '%s' "$INDEX_CACHE" | grep -qi 'no-cache' &&
            echo "✅ Document d'entrée revalidé" ||
            echo "⚠️ index.html servi sans revalidation — un navigateur peut garder l'ancienne interface"

          # À l'inverse, les fichiers versionnés doivent garder leur cache long :
          # les revalider à chaque chargement coûterait un aller-retour par
          # fichier sur un réseau mobile, sans rien apporter.
          FIRST_ASSET=$(printf '%s' "$INDEX" | grep -oE 'assets/[^" ]+\.js' | head -1)
          ASSET_CACHE=$(curl -fsSI "https://vpnsxb.afrihall.com/$FIRST_ASSET" | tr -d '\r' | grep -i '^cache-control:' || true)
          echo "$FIRST_ASSET cache-control: ${ASSET_CACHE:-<absent>}"
          printf '%s' "$ASSET_CACHE" | grep -qi 'immutable' ||
            (echo "❌ Fichier versionné sans cache long" && exit 1)

          # Le paquet est désormais découpé en plusieurs morceaux : un marqueur
          # donné ne vit que dans l'un d'eux. On les concatène donc tous avant
          # de chercher, sinon la validation dépendrait de l'ordre des fichiers.
          ASSETS=$(printf '%s' "$INDEX" | grep -oE 'assets/[^\" ]+\.js' | sort -u)
          [ -n "$ASSETS" ] || (echo "❌ Frontend JS asset missing" && exit 1)
          ALL=""
          for A in $ASSETS; do
            DECLARED=$(curl -sI "https://vpnsxb.afrihall.com/$A" | grep -i '^content-length' | tr -d '\r' | awk '{print $2}')
            GOT=$(curl -fsS -o /tmp/chunk.js -w '%{size_download}' "https://vpnsxb.afrihall.com/$A")
            echo "  $A : $GOT / $DECLARED octets"
            # Un morceau tronqué casse le module et laisse une page vide : on
            # préfère faire échouer le déploiement que livrer un écran blanc.
            if [ -n "$DECLARED" ] && [ "$GOT" != "$DECLARED" ]; then
              echo "❌ Chunk tronqué : $A ($GOT au lieu de $DECLARED)"
              exit 1
            fi
            ALL="$ALL$(cat /tmp/chunk.js)"
          done
          printf '%s' "$ALL" | grep -q 'V2Ray / Xray' || (echo "❌ New Xray editor marker missing from live bundle" && exit 1)
          printf '%s' "$ALL" | grep -q 'Valider le transport' || (echo "❌ New transport validation marker missing from live bundle" && exit 1)
          echo "✅ Frontend bundle verified ($(printf '%s\n' "$ASSETS" | wc -l) morceaux)"

          echo "=== API health ==="
          # Accepte 200/400/401/403/422 — toute réponse HTTP valide du serveur
          # (400 = bad request pour creds invalides = serveur UP)
          API=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://vpnsxb.afrihall.com/xapi/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test","password":"test"}')
          echo "API HTTP $API"
          case "$API" in
            200|400|401|403|422)
              echo "✅ API up (HTTP $API — réponse valide du serveur)" ;;
            000)
              echo "❌ API unreachable (timeout/DNS)" && exit 1 ;;
            502|503|504)
              echo "❌ API down (gateway error $API)" && exit 1 ;;
            *)
              echo "⚠️  API HTTP $API — considéré OK (pas une erreur réseau)" ;;
          esac
          echo "✅ Production OK"
