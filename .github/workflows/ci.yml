name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: |
          pnpm exec prisma validate --schema=prisma/schema.prisma
          pnpm exec prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://127.0.0.1:5432/sxb_ci"

      - name: Validate scripts
        run: bash -n scripts/prod/*.sh

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
