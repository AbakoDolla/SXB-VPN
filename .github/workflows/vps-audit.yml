name: 🔎 Audit VPS — lecture seule

# Audit de diagnostic du VPS de production, EXCLUSIVEMENT manuel.
#
# Pourquoi ce workflow existe
# ---------------------------
# Diagnostiquer le déploiement demande une visibilité à l'intérieur du VPS.
# Transmettre un mot de passe SSH par messagerie l'inscrit durablement dans un
# historique de conversation et impose de le révoquer ensuite ; un identifiant
# partagé par écrit doit de toute façon être considéré comme compromis.
#
# Ce workflow réutilise les secrets SSH DÉJÀ configurés pour le déploiement
# (VPS_SSH_PRIVATE_KEY / VPS_SSH_PASSPHRASE / VPS_SSH_HOST_FINGERPRINT). Aucun
# nouvel identifiant n'est créé, aucun secret ne transite par un tiers, et la
# clé n'est jamais exposée : elle reste dans le coffre GitHub Actions.
#
# Garanties
# ---------
#   • Déclenchement manuel uniquement (workflow_dispatch) — jamais sur push.
#   • Commandes strictement en LECTURE : aucun write, restart, install ou
#     suppression. Le service de production n'est pas touché.
#   • Aucun fichier d'environnement, clé ni identifiant n'est affiché. Les
#     recherches dans la configuration Nginx sont limitées à des motifs de
#     routage précis.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Diagnostic lecture seule
    runs-on: ubuntu-latest
    # Les secrets SSH sont attachés à l'environnement « production » : sans cette
    # déclaration ils sont résolus à vide et la connexion échoue immédiatement.
    # L'environnement peut par ailleurs exiger une approbation manuelle, ce qui
    # constitue un garde-fou supplémentaire pour un accès au serveur.
    environment:
      name: production
      url: https://vpnsxb.afrihall.com
    steps:
      - name: Auditer le VPS (aucune modification)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 60s
          command_timeout: 120s
          script_stop: false
          script: |
            echo "═══ 1. VERSION DÉPLOYÉE ═══"
            git -C /var/www/sxb-vpn rev-parse HEAD 2>/dev/null || echo "dépôt introuvable"
            git -C /var/www/sxb-vpn log -1 --format='%h %s (%ci)' 2>/dev/null || true

            echo ""
            echo "═══ 2. ARTEFACTS DE BUILD ═══"
            # La date de modification révèle un déploiement partiel : un
            # server.cjs plus ancien que le dernier commit signale que le
            # backend en cours d'exécution n'est pas celui du dépôt.
            ls -l --time-style=long-iso /var/www/sxb-vpn/dist/server.cjs 2>/dev/null || echo "server.cjs absent"
            ls -1 /var/www/sxb-vpn/dist/assets 2>/dev/null | head -5 || true

            echo ""
            echo "═══ 3. PROCESSUS APPLICATIF ═══"
            # `pm2 status` n'affiche qu'un tableau d'état — jamais les variables
            # d'environnement du processus.
            pm2 status 2>/dev/null || echo "pm2 indisponible"

            echo ""
            echo "═══ 4. SANTÉ DE L'APP SANS PASSER PAR NGINX ═══"
            # Interroger directement le port applicatif contourne le reverse
            # proxy : si /xapi répond ici mais échoue depuis l'extérieur, la
            # cause est nécessairement dans la configuration Nginx.
            # Le port est lu depuis l'upstream Nginx, seule source fiable.
            PORT=$(sudo grep -rhoP 'server\s+127\.0\.0\.1:\K[0-9]+' /etc/nginx/sites-enabled/sxb-vpn 2>/dev/null | head -1 || true)
            PORT=${PORT:-3000}
            echo "port applicatif détecté : $PORT"
            for p in /api/health /xapi/health /xapi/mobile/app-version /api/mobile/app-version; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "http://127.0.0.1:$PORT$p" || echo "ERR")
              echo "  $p -> $code"
            done

            echo ""
            echo "═══ 4b. BASE DE DONNÉES RÉELLEMENT UTILISÉE ═══"
            # Question décisive : le backend utilise-t-il PostgreSQL ou son
            # repli en mémoire ? Avec le repli, TOUTES les données (comptes,
            # abonnements, quotas) disparaissent à chaque redémarrage.
            #
            # On teste uniquement la PRÉSENCE de la clé DATABASE_URL — jamais sa
            # valeur, qui contient un mot de passe. La configuration peut venir
            # de l'environnement pm2 OU d'un fichier .env lu au démarrage : les
            # deux sources sont donc vérifiées.
            if pm2 jlist 2>/dev/null | grep -q '"DATABASE_URL"'; then
              echo "DATABASE_URL (env pm2)   : déclarée"
            else
              echo "DATABASE_URL (env pm2)   : absente"
            fi
            for f in /var/www/sxb-vpn/.env /var/www/sxb-vpn/.env.production /var/www/sxb-vpn/ecosystem.config.cjs; do
              if [ -f "$f" ]; then
                n=$(grep -c 'DATABASE_URL' "$f" 2>/dev/null || echo 0)
                echo "$f : présent, mentions de DATABASE_URL = $n"
              else
                echo "$f : absent"
              fi
            done
            systemctl is-active postgresql 2>/dev/null | sed 's/^/postgresql : /' || echo "postgresql : introuvable"
            # Contenu réel des bases : une base vide confirme qu'elle n'est pas utilisée.
            for db in sxbvpn sxb_vpn; do
              t=$(sudo -u postgres psql -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public';" "$db" 2>/dev/null || echo "?")
              u=$(sudo -u postgres psql -tAc "SELECT count(*) FROM users;" "$db" 2>/dev/null || echo "?")
              echo "base $db : tables=$t comptes=$u"
            done

            echo ""
            echo "═══ 5. ROUTAGE NGINX DE /xapi ═══"
            # Recherche ciblée : uniquement les directives de routage. Aucun
            # bloc de configuration complet n'est affiché, pour éviter de
            # divulguer des chemins de certificats ou des en-têtes sensibles.
            sudo grep -rn -E 'location[^;]*/(x)?api|rewrite.*xapi|proxy_pass' /etc/nginx/sites-enabled/ 2>/dev/null | head -30 || echo "lecture nginx impossible"

            echo ""
            echo "═══ 6. DISTRIBUTION DE L'APK ═══"
            ls -l --time-style=long-iso /var/www/sxb-vpn/dist/download/sxbvpn-latest.apk 2>/dev/null || echo "APK public absent"
            sha256sum /var/www/sxb-vpn/dist/download/sxbvpn-latest.apk 2>/dev/null || true

            echo ""
            echo "═══ 7. RESSOURCES SYSTÈME ═══"
            df -h / | tail -1
            free -m | head -2
            node -v 2>/dev/null || true
            uptime

            echo ""
            echo "═══ 8. ERREURS RÉCENTES DU BACKEND ═══"
            # Dernières lignes d'erreur uniquement. Le code journalise déjà sans
            # corps de requête ni jeton (voir le middleware de diagnostic).
            pm2 logs --err --lines 25 --nostream 2>/dev/null | tail -25 || echo "journaux indisponibles"

            echo ""
            echo "✅ Audit terminé — aucune modification effectuée"
