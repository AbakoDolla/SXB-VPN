name: Prepare and read root approval public authority
run-name: Root approval ${{ inputs.mode }} — ${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, prepare]
        default: inspect
        required: true
        description: Read-only inspect, or prepare a dedicated server-only signing secret once
      confirmed:
        type: boolean
        default: false
        description: Confirm adding only a missing ROOT_APPROVAL_SECRET with a private environment backup
      operation_id:
        type: string
        required: true
        description: Unique read-only receipt identifier
permissions:
  contents: read
concurrency:
  group: deploiement-production
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Encode read-only public authority inspector
        run: |
          set -euo pipefail
          printf 'SXB_ROOT_CODE=%s\n' "$(base64 -w0 scripts/root-approval-key.cjs)" >> "$GITHUB_ENV"
      - name: Read public authority without exporting a private key
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          SXB_ROOT_EXPECTED_SHA: ${{ github.sha }}
          SXB_ROOT_MODE: ${{ inputs.mode }}
          SXB_ROOT_CONFIRMED: ${{ inputs.confirmed }}
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 30s
          envs: SXB_ROOT_CODE,SXB_ROOT_EXPECTED_SHA,SXB_ROOT_MODE,SXB_ROOT_CONFIRMED
          script: |
            set -euo pipefail
            set +x
            export NODE_OPTIONS= NODE_PATH=
            cd /var/www/sxb-vpn
            script_file="$(mktemp /tmp/sxb-root-key.XXXXXXXX.cjs)"
            trap 'rm -f "$script_file"' EXIT
            printf '%s' "$SXB_ROOT_CODE" | base64 --decode > "$script_file"
            timeout 20s node "$script_file"
