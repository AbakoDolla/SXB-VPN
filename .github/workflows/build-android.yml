name: Build Android APK — SXB VPN

on:
  push:
    branches: [main]
    paths:
      - "app-mobile/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-mobile

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js & Optimized Caching ───────────────────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app-mobile/package-lock.json

      # ── JDK 17 & Advanced Gradle Setup ────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      # ── Install dependencies (CI mode) ────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Barrière qualité — bloque la release avant toute génération native ────
      - name: Tests de non-régression mobile
        run: |
          npm run typecheck
          npm run test:regression

      # FIX #1 : patch Kotlin metadata compat — après npm install (node_modules/ doit exister)
      - name: Patch expo-module-gradle-plugin (Kotlin metadata compat)
        run: |
          PLUGIN="node_modules/expo-modules-core/expo-module-gradle-plugin/build.gradle.kts"
          if [ -f "$PLUGIN" ] && ! grep -q "Xskip-metadata-version-check" "$PLUGIN"; then
            printf '\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {\n    kotlinOptions { freeCompilerArgs = freeCompilerArgs + listOf("-Xskip-metadata-version-check") }\n}\n' >> "$PLUGIN"
            echo "[patch] Kotlin metadata fix appliqué"
          else
            echo "[patch] Déjà appliqué ou expo-modules-core absent (normal si cache node)"
          fi

      # Note: Caching is now handled by gradle/actions/setup-gradle for dependencies.
      # Local build artifacts are kept transiently to avoid corruption across runs.

      # ── Expo prebuild — TOUJOURS propre et déterministe ───────────────────────
      # --clean élimine tout dossier Android résiduel et force la cohérence avec
      # app.json (namespace, package, ressources launcher et classes Kotlin).
      # Les dépendances Gradle restent réutilisables via setup-gradle et le cache.
      - name: Expo prebuild (Android, clean)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: https://vpnsxb.afrihall.com/api

      # ── Packaging JNI robuste pour les installateurs OEM ──────────────────────
      # Le mode legacy compresse les .so et laisse Android les extraire. Cela
      # évite qu’un appareil refuse l’APK lorsque ses contraintes de page-memory
      # ne correspondent pas à l’alignement produit par AGP/apksigner.
      - name: Forcer le packaging JNI legacy
        run: |
          set -euo pipefail
          if grep -q '^expo\.useLegacyPackaging=' android/gradle.properties; then
            sed -i 's/^expo\.useLegacyPackaging=.*/expo.useLegacyPackaging=true/' android/gradle.properties
          else
            printf '\nexpo.useLegacyPackaging=true\n' >> android/gradle.properties
          fi
          grep -q '^expo\.useLegacyPackaging=true$' android/gradle.properties
          echo "✅ Packaging JNI legacy activé"

      # ── P2b — GARANTIR SxbVpnPackage dans MainApplication.kt ─────────────────
      # Le plugin withMainAppPackage() peut échouer si le pattern de getPackages()
      # ne correspond à aucune regex. Ce step est le filet de sécurité : il injecte
      # directement via sed si SxbVpnPackage est absent après le prebuild.
      - name: Vérifier et forcer injection SxbVpnPackage dans MainApplication.kt
        run: |
          MAIN_APP=$(find android/app/src/main/java -name "MainApplication.kt" 2>/dev/null | head -1)
          if [ -z "$MAIN_APP" ]; then
            echo "::error::MainApplication.kt introuvable après prebuild"
            exit 1
          fi
          echo "[SxbVpnPackage] Fichier : $MAIN_APP"
          if grep -q "SxbVpnPackage" "$MAIN_APP"; then
            echo "✅ SxbVpnPackage déjà présent (plugin OK)"
          else
            echo "⚠️  SxbVpnPackage absent — injection manuelle..."

            # Ajouter import après la ligne package
            sed -i '/^package /a import com.sxbvpn.vpnmodule.SxbVpnPackage' "$MAIN_APP"

            # Pattern Expo SDK 50+ / RN 0.73+ : .packages.apply {
            if grep -q "PackageList(this).packages.apply" "$MAIN_APP"; then
              sed -i 's/PackageList(this).packages.apply {/PackageList(this).packages.apply {\n        add(SxbVpnPackage())/' "$MAIN_APP"
              echo "[inject] Pattern .packages.apply {} patché (RN 0.73+)"

            # Pattern RN 0.71-0.72 : val packages = PackageList(this).packages
            elif grep -q "val packages = PackageList(this).packages" "$MAIN_APP"; then
              sed -i 's/val packages = PackageList(this).packages/val packages = PackageList(this).packages\n      packages.add(SxbVpnPackage())/' "$MAIN_APP"
              echo "[inject] Pattern val packages patché (RN 0.71-0.72)"

            # Fallback : avant le premier "return packages"
            elif grep -q "return packages" "$MAIN_APP"; then
              sed -i 's/return packages/add(SxbVpnPackage())\n      return packages/' "$MAIN_APP"
              echo "[inject] Pattern return packages patché (fallback)"

            else
              echo "::error::Aucun pattern connu dans MainApplication.kt — injection impossible"
              cat "$MAIN_APP"
              exit 1
            fi

            # Vérification finale
            if grep -q "SxbVpnPackage" "$MAIN_APP"; then
              echo "✅ Injection réussie"
            else
              echo "::error::Injection échouée — SxbVpnPackage toujours absent"
              cat "$MAIN_APP"
              exit 1
            fi
          fi

          # Vérifier aussi que les fichiers Kotlin sont copiés
          KOTLIN_DIR="android/app/src/main/java/com/sxbvpn/vpnmodule"
          if [ -d "$KOTLIN_DIR" ] && ls "$KOTLIN_DIR"/*.kt 2>/dev/null | grep -q SxbVpnModule; then
            echo "✅ Fichiers Kotlin natifs présents dans $KOTLIN_DIR"
          else
            echo "⚠️  Kotlin natifs absents — copie manuelle..."
            mkdir -p "$KOTLIN_DIR"
            cp modules/android-native/*.kt "$KOTLIN_DIR/" && echo "✅ Copiés"
          fi

      # ── JNI : rendre explicite le packaging des .so de libbox.aar ─────────────
      # AGP peut consommer un AAR sans recopier ses jni/ dans l’APK selon la
      # combinaison de plugins. On place donc les bibliothèques natives dans le
      # dossier standard jniLibs de l’application avant Gradle.
      - name: Extraire les bibliothèques natives libbox vers jniLibs
        run: |
          set -euo pipefail
          AAR="android/app/libs/libbox.aar"
          JNI_ROOT="android/app/src/main/jniLibs"
          if [ ! -s "$AAR" ]; then
            echo "::error::libbox.aar absent après expo prebuild"
            exit 1
          fi
          rm -rf /tmp/libbox-aar-extract "$JNI_ROOT"
          mkdir -p /tmp/libbox-aar-extract "$JNI_ROOT"
          unzip -q "$AAR" 'jni/*' -d /tmp/libbox-aar-extract
          SO_COUNT=0
          while IFS= read -r -d '' SO; do
            REL="${SO#/tmp/libbox-aar-extract/jni/}"
            DEST="$JNI_ROOT/$REL"
            mkdir -p "$(dirname "$DEST")"
            cp "$SO" "$DEST"
            SO_COUNT=$((SO_COUNT + 1))
          done < <(find /tmp/libbox-aar-extract/jni -type f -name '*.so' -print0 2>/dev/null)
          if [ "$SO_COUNT" -eq 0 ]; then
            echo "::error::libbox.aar ne contient aucune bibliothèque jni/*.so"
            unzip -l "$AAR" | head -80
            exit 1
          fi
          zip -q -d "$AAR" 'jni/*' >/dev/null 2>&1 || true
          echo "✅ $SO_COUNT bibliothèque(s) libbox extraites dans $JNI_ROOT"
          find "$JNI_ROOT" -type f -name '*.so' -printf '%p %s octets\\n' | sort

      # ── P3 — ProGuard : règles R8 pour JSch + sing-box + modules SXB ──────────
      - name: Créer proguard-rules.pro (JSch + sing-box + natif SXB)
        run: |
          PGFILE="android/app/proguard-rules.pro"
          printf '%s\n' \
            '# JSch — SSH library' \
            '-keep class com.jcraft.jsch.** { *; }' \
            '-dontwarn com.jcraft.jsch.**' \
            '# Modules natifs SXB VPN' \
            '-keep class com.sxbvpn.** { *; }' \
            '-keepclassmembers class com.sxbvpn.** { *; }' \
            '-keepattributes Signature,*Annotation*,EnclosingMethod,InnerClasses' \
            '# React Native / Expo' \
            '-keep class com.facebook.react.** { *; }' \
            '-dontwarn com.facebook.react.**' \
            >> "$PGFILE"
          echo "[ProGuard] Règles ajoutées à $PGFILE ($(wc -l < $PGFILE) lignes)"



      # FIX #2 : JitPack — injecter seulement dans la section dependencyResolutionManagement
      # (première occurrence de mavenCentral uniquement pour éviter les doublons)
      - name: Injecter JitPack dans settings.gradle
        run: |
          SETTINGS="android/settings.gradle"
          if [ -f "$SETTINGS" ] && ! grep -q "jitpack.io" "$SETTINGS"; then
            # Remplacer SEULEMENT la première occurrence de mavenCentral()
            sed -i '0,/mavenCentral()/{s|mavenCentral()|mavenCentral()\n        maven { url = uri("https://jitpack.io") }|}' "$SETTINGS"
            echo "[JitPack] Injecté dans $SETTINGS (première occurrence)"
            grep -n "jitpack" "$SETTINGS" | head -3
          else
            echo "[JitPack] Déjà présent ou settings.gradle absent"
          fi

      # ── ABI : compatibilité appareils 64 bits et 32 bits ─────────────────────
      - name: Configurer les ABI arm64-v8a et armeabi-v7a
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if grep -q 'abiFilters' "$BUILD_GRADLE" 2>/dev/null; then
            sed -i 's/abiFilters.*/abiFilters "arm64-v8a", "armeabi-v7a"/' "$BUILD_GRADLE"
          else
            sed -i '/defaultConfig {/a\            ndk { abiFilters "arm64-v8a", "armeabi-v7a" }' "$BUILD_GRADLE"
          fi
          GPROPS="android/gradle.properties"
          if grep -q '^reactNativeArchitectures=' "$GPROPS" 2>/dev/null; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' "$GPROPS"
          else
            echo 'reactNativeArchitectures=arm64-v8a,armeabi-v7a' >> "$GPROPS"
          fi
          echo "[ABI] Filtres appliqués : arm64-v8a, armeabi-v7a"

      # ── Copier sing-box vers Android assets natifs ────────────────────────────
      - name: Copier sing-box vers Android assets natifs
        run: |
          mkdir -p android/app/src/main/assets
          for f in sing-box-arm64 sing-box-arm; do
            if [ -f "assets/$f" ]; then
              cp "assets/$f" "android/app/src/main/assets/$f"
              echo "✅ $f ($(du -h "android/app/src/main/assets/$f" | cut -f1))"
            else
              echo "⚠️  $f absent dans assets/ — sing-box désactivé pour cette architecture"
            fi
          done

      # Signature de production obligatoire : une clé éphémère rend toute mise à jour
      # Android impossible au-dessus d’une APK déjà distribuée. La release échoue donc
      # explicitement si les quatre secrets de signature ne sont pas configurés.
      - name: Configurer le keystore de release persistant (Secrets GitHub obligatoires)
        env:
          KEYSTORE_FILE:     ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystore
          if [ -z "$KEYSTORE_FILE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS et KEY_PASSWORD requis pour publier une APK installable par mise à jour"
            exit 1
          fi
          echo "$KEYSTORE_FILE" | base64 -d > android/app/keystore/release.keystore
          STORE_PASS="$KEYSTORE_PASSWORD"
          KEY_AL="$KEY_ALIAS"
          KEY_PW="$KEY_PASSWORD"
          echo "✅ Keystore de release restauré depuis GitHub Secrets"
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_AL=$KEY_AL"         >> $GITHUB_ENV
          echo "KEY_PW=$KEY_PW"         >> $GITHUB_ENV

          BUILD_GRADLE="android/app/build.gradle"

          # Export shell→process enfant (node lira via process.env)
          export STORE_PASS KEY_AL KEY_PW

          # Script JS encodé base64 — évite col-0 / heredoc incompatible avec YAML
          echo "" | base64 -d > /tmp/signing_inject.js
          node /tmp/signing_inject.js "$BUILD_GRADLE"

      # ── Compatibilité signature Android ───────────────────────────────────────
      # Android 7+ accepte v2, mais certains installateurs/OEM attendent encore
      # la signature JAR v1. La signature v1+v2 élargit la compatibilité sans
      # changer le certificat de release persistant.
      - name: Activer les signatures APK v1 et v2
        run: |
          node - << 'NODEJS_EOF'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let content = fs.readFileSync(p, 'utf8');
          if (!content.includes('enableV1Signing true')) {
            const signingStart = content.indexOf('signingConfigs');
            const keyPassword = content.indexOf('keyPassword', signingStart);
            if (signingStart < 0 || keyPassword < 0) throw new Error('Bloc signingConfigs.release introuvable');
            const lineEnd = content.indexOf('\n', keyPassword);
            const injection = '        enableV1Signing true\n        enableV2Signing true\n';
            content = content.slice(0, lineEnd + 1) + injection + content.slice(lineEnd + 1);
            fs.writeFileSync(p, content);
            console.log('[signing] enableV1Signing=true, enableV2Signing=true');
          } else {
            console.log('[signing] signatures v1/v2 déjà activées');
          }
          NODEJS_EOF

      # ── Versionnage Android monotone ───────────────────────────────────────────
      # GitHub run_number est strictement croissant pour ce workflow et doit dépasser
      # le versionCode existant afin de permettre une installation par-dessus l’APK.
      - name: Imposer un versionCode de release croissant
        env:
          SXB_VERSION_CODE: ${{ github.run_number }}
        run: |
          node - << 'NODEJS_EOF'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          const requested = Number(process.env.SXB_VERSION_CODE || 0);
          if (!Number.isInteger(requested) || requested < 1) throw new Error('versionCode CI invalide');
          let content = fs.readFileSync(p, 'utf8');
          const match = content.match(/versionCode\s+(\d+)/);
          if (!match) throw new Error('versionCode introuvable dans build.gradle');
          const current = Number(match[1]);
          const next = Math.max(current + 1, requested);
          content = content.replace(/versionCode\s+\d+/, `versionCode ${next}`);
          fs.writeFileSync(p, content);
          console.log(`[version] versionCode ${current} → ${next}`);
          NODEJS_EOF

      # FIX SIGNING — Supprimer signingConfig signingConfigs.debug du bloc release
      # Groovy : la DERNIÈRE affectation d'une propriété gagne. Expo prebuild injecte
      # "signingConfig signingConfigs.debug" dans buildTypes.release. Notre inject
      # ajoute .release AVANT → la ligne debug vient en dernier → APK signé debug.
      # Ce step supprime la ligne debug UNIQUEMENT dans le bloc release {}.
      - name: Retirer signingConfig debug du bloc release (fix Groovy last-wins)
        run: |
          node - << 'NODEJS_EOF'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          const lines = fs.readFileSync(p, 'utf8').split('\n');
          let inRelease = false, depth = 0, removed = 0;
          const result = lines.map(line => {
            // Détecter entrée dans buildTypes > release { }
            if (/^\s*release\s*\{/.test(line)) { inRelease = true; depth = 1; return line; }
            if (inRelease) {
              for (const ch of line) { if (ch==='{') depth++; else if (ch==='}') depth--; }
              if (depth <= 0) { inRelease = false; return line; }
              // Supprimer la ligne debug signingConfig dans le bloc release
              if (/signingConfig\s+signingConfigs\.debug/.test(line)) {
                console.log('[signing-fix] Supprimé: ' + line.trim());
                removed++;
                return null;
              }
            }
            return line;
          }).filter(l => l !== null).join('\n');
          fs.writeFileSync(p, result);
          console.log('[signing-fix] OK — ' + removed + ' ligne(s) debug supprimée(s) du bloc release');
          NODEJS_EOF

      # FIX #4 : Gradle properties — newArchEnabled=false (cohérent avec app.json)
      # CORRECTION CRITIQUE : newArchEnabled=true forçait la nouvelle architecture alors
      # que le module natif SxbVpnModule utilise l'ancienne (ReactContextBaseJavaModule).
      # Forcer new arch ON causait des erreurs de compilation Kotlin.
      - name: Configure Gradle (performance + compatibilité RN)
        run: |
          GPROPS="android/gradle.properties"
          # Idempotent : ajouter une propriété seulement si sa clé n'est pas déjà présente
          add_prop() {
            local KEY="${1%%=*}"
            local VAL="$1"
            if ! grep -q "^${KEY}=" "$GPROPS" 2>/dev/null; then
              echo "$VAL" >> "$GPROPS"
              echo "[gradle.properties] + $KEY"
            fi
          }
          add_prop 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC'
          add_prop 'org.gradle.daemon=false'
          add_prop 'org.gradle.parallel=true'
          add_prop 'org.gradle.caching=true'
          add_prop 'android.enableJetifier=true'
          add_prop 'android.enableR8.fullMode=false'
          add_prop 'kotlin.incremental=true'
          add_prop 'newArchEnabled=false'
          if grep -q '^reactNativeArchitectures=' "$GPROPS" 2>/dev/null; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' "$GPROPS"
          else
            echo 'reactNativeArchitectures=arm64-v8a,armeabi-v7a' >> "$GPROPS"
          fi
          echo "[Gradle] gradle.properties configuré (newArchEnabled=false, ABI arm64-v8a + armeabi-v7a)"

      # FIX #5 : Packaging META-INF — bash+sed pur (pas de Python, pas de heredoc)
      # Le plugin withJschDependency injecte packaging{} durant le prebuild.
      # Ce step complète les excludes manquants sans créer de doublon.
      - name: Corriger conflits META-INF (packaging build.gradle)
        run: |
          B="android/app/build.gradle"
          if grep -q 'packaging' "$B" 2>/dev/null; then
            echo "[packaging] Bloc packaging présent (injecté par le plugin Expo)"
            for EXCL in \
              'META-INF/versions/**' \
              'META-INF/versions/9/OSGI-INF/MANIFEST.MF' \
              'META-INF/versions/11/OSGI-INF/MANIFEST.MF' \
              'META-INF/*.kotlin_module' \
              'META-INF/AL2.0' \
              'META-INF/LGPL2.1'; do
              if ! grep -q "$EXCL" "$B"; then
                sed -i "s|resources {|resources {\n            excludes += \"$EXCL\"|" "$B"
                echo "[packaging] + $EXCL"
              fi
            done
          else
            echo "[packaging] Aucun bloc packaging — injection depuis zéro (GNU sed)"
            sed -i 's|android {|android {\n    packaging {\n        resources {\n            excludes += "/META-INF/{AL2.0,LGPL2.1}"\n            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"\n            excludes += "META-INF/*.kotlin_module"\n            excludes += "META-INF/LICENSE.md"\n            excludes += "META-INF/LICENSE-notice.md"\n        }\n    }|' "$B"
          fi
          echo "✅ Packaging META-INF configuré"

      # ── Précharger Gradle avec reprises réseau ─────────────────────────────────
      # services.gradle.org redirige vers GitHub Releases, qui peut répondre 503
      # ponctuellement. Réessayer ici évite une release perdue avant compilation.
      - name: Précharger Gradle avec reprises réseau
        working-directory: app-mobile/android
        run: |
          set -o pipefail
          chmod +x gradlew
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version --no-daemon; then
              echo "✅ Distribution Gradle disponible (tentative $attempt)"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 20))
              echo "⚠️ Téléchargement Gradle indisponible ; nouvelle tentative dans ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Distribution Gradle indisponible après 5 tentatives"
          exit 1

      # ── Build APK release (Optimized) ─────────────────────────────────────────
      - name: Build APK (release)
        working-directory: app-mobile/android
        run: |
          set -o pipefail
          chmod +x gradlew

          # Build direct avec skips forcés (gain ~45s de scan de tâches)
          ./gradlew :app:assembleRelease \
            -x :app:lintVitalRelease \
            -x :app:lintVitalAnalyzeRelease \
            --no-daemon \
            --build-cache \
            --parallel \
            2>&1 | tee /tmp/gradle-build.log

          echo "::group::Gradle output (dernières 100 lignes)"
          tail -100 /tmp/gradle-build.log
          echo "::endgroup::"
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://vpnsxb.afrihall.com/api
          ANDROID_HOME: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── Localiser et copier l'APK ─────────────────────────────────────────────
      - name: Localiser et copier l'APK
        run: |
          mkdir -p build
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | grep -v unsigned | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::Aucun APK trouvé — liste des sorties :"
            find android/app/build/outputs -type f 2>/dev/null || true
            echo "--- Gradle log (erreurs) ---"
            grep -E "FAILED|error:|Error|BUILD" /tmp/gradle-build.log | tail -30 || true
            exit 1
          fi

          # AGP peut conserver v2 uniquement malgré enableV1Signing. Avant
          # toute signature, page-aligner les .so pour les appareils dont le
          # chargeur exige un alignement natif 16 KiB. Toute modification après
          # signature invaliderait l’APK, donc cette étape précède apksigner.
          ZIPALIGN=$(find "${ANDROID_HOME}/build-tools" -type f -name zipalign 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$ZIPALIGN" ]; then
            echo "::error::zipalign introuvable avant alignement natif"
            exit 1
          fi
          ALIGNED_APK="${APK}.aligned"
          "$ZIPALIGN" -P 16 -f 4 "$APK" "$ALIGNED_APK"
          mv -f "$ALIGNED_APK" "$APK"

          # Re-signer explicitement avec le keystore persistant garantit la
          # compatibilité des installateurs OEM et permet à la validation
          # suivante de vérifier réellement v1 + v2.
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner introuvable avant re-signature post-build"
            exit 1
          fi
          SIGNED_APK="${APK}.signed"
          "$APKSIGNER" sign \
            --ks "${GITHUB_WORKSPACE}/app-mobile/android/app/keystore/release.keystore" \
            --ks-pass env:STORE_PASS \
            --ks-key-alias "$KEY_AL" \
            --key-pass env:KEY_PW \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$SIGNED_APK" "$APK"
          mv -f "$SIGNED_APK" "$APK"
          cp "$APK" build/sxb-vpn.apk
          echo "✅ APK: $(ls -lh build/sxb-vpn.apk)"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ── Validation installabilité avant artifact/release ─────────────────────
      - name: Valider APK (archive, manifeste, signature et ABI disponibles)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          # Les étapes `run` héritent de defaults.run.working-directory: app-mobile.
          # Utiliser un chemin absolu rend la validation indépendante de ce contexte.
          APK="${GITHUB_WORKSPACE}/app-mobile/build/sxb-vpn.apk"
          test -s "$APK"
          unzip -t "$APK" >/tmp/apk-zip-test.log
          # Écrire la liste une seule fois : avec pipefail, grep -q peut fermer
          # prématurément unzip et transformer une vérification réussie en échec SIGPIPE.
          unzip -l "$APK" >/tmp/apk-list.log
          grep -q 'AndroidManifest.xml' /tmp/apk-list.log
          ABI_LIST=$(sed -n 's#.*lib/\([^/]\+\)/.*#\1#p' /tmp/apk-list.log | sort -u | tr '\n' ' ')
          if [ -z "$ABI_LIST" ]; then
            echo "::error::Aucune bibliothèque native ABI n’est présente dans l’APK"
            grep -E '(^|/)lib/|libbox' /tmp/apk-list.log | head -80 || true
            exit 1
          fi
          if ! grep -qE 'lib/[^/]+/libbox\.so' /tmp/apk-list.log; then
            echo "::error::libbox.so absent de l’APK final — moteur VPN non embarqué"
            grep -E '(^|/)lib/|libbox' /tmp/apk-list.log | head -80 || true
            exit 1
          fi
          echo "[APK] ABI natives présentes : $ABI_LIST ; libbox.so présent"
          ZIPALIGN=$(find "${ANDROID_HOME}/build-tools" -type f -name zipalign 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$ZIPALIGN" ]; then
            echo "::error::zipalign introuvable — validation de l’alignement impossible"
            exit 1
          fi
          "$ZIPALIGN" -c -v 4 "$APK" >/tmp/apk-zipalign.log
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/tmp/apk-zipalign-page.log
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner introuvable — validation cryptographique obligatoire"
            exit 1
          fi
          # Avec minSdk 24, apksigner n’affiche pas v1 dans sa vérification
          # par défaut, même si les entrées JAR sont présentes. Vérifier v1
          # comme le ferait une plateforme API 23 et v2 comme la plateforme API 24+.
          VERIFY_V1=$("$APKSIGNER" verify --verbose --min-sdk-version 23 "$APK" 2>&1)
          VERIFY_PLATFORM=$("$APKSIGNER" verify --verbose "$APK" 2>&1)
          printf '%s\n' "$VERIFY_V1"
          printf '%s\n' "$VERIFY_PLATFORM"
          printf '%s\n' "$VERIFY_V1" | grep -qE 'Verified using v1 scheme \(JAR signing\): true'
          printf '%s\n' "$VERIFY_PLATFORM" | grep -qE 'Verified using v2 scheme \(APK Signature Scheme v2\): true'
          AAPT=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt introuvable — validation du manifeste impossible"
            exit 1
          fi
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -q "package: name='com.sxbvpn.mobile'"
          printf '%s\n' "$BADGING" | grep -q "sdkVersion:'24'"
          printf '%s\n' "$BADGING" | grep -q "targetSdkVersion:'36'"
          echo "✅ APK alignée, signée v1/v2, manifeste et ABI validés : $(stat -c%s "$APK") octets"
          sha256sum "$APK"

      # ── Upload artifact CI ────────────────────────────────────────────────────
      - name: Upload APK (artifact CI)
        uses: actions/upload-artifact@v4
        with:
          name: sxb-vpn-android-apk-${{ github.run_number }}
          path: app-mobile/build/sxb-vpn.apk
          if-no-files-found: error
          retention-days: 30

      # ── GitHub Release ────────────────────────────────────────────────────────
      - name: GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "SXB VPN APK #${{ github.run_number }}"
          body: |
            ## SXB VPN — APK Android #${{ github.run_number }}

            Build depuis commit `${{ github.sha }}`

            ### Moteur VPN v5
            - ✅ **VLESS / VMess / Trojan** — sing-box
            - ✅ **Shadowsocks / WireGuard / Hysteria2 / TUIC** — sing-box
            - ✅ **SSH / SSH+Payload** — JSch natif Java
            - ✅ **Kill Switch** — coupe le trafic si VPN déconnecté
            - ✅ **Auto-reconnect** — backoff exponentiel (1s→30s, 10 tentatives)
            - ✅ **Trafic temps réel** — Android TrafficStats (valeurs réelles)
            - ✅ **Config chiffrée** — Android Keystore AES-256-GCM
            - ✅ **Détection Root/Frida/Xposed** — audit sécurité avant connexion
            - ✅ **Foreground Service** — fonctionne écran verrouillé / swipe
            - ✅ **Interface FR/EN**

            ### Installation
            1. Télécharger `sxb-vpn.apk`
            2. Android → Paramètres → Sécurité → Sources inconnues → Activer
            3. Installer et activer avec votre token `SXB-USER-XXXX-XXXX-XXXX`

            ### Backend
            `https://vpnsxb.afrihall.com/api`
          files: app-mobile/build/sxb-vpn.apk
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Déployer APK sur VPS ──────────────────────────────────────────────────
      - name: Déployer APK sur VPS (scp)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 141.95.112.93
          username: ubuntu
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          source: "app-mobile/build/sxb-vpn.apk"
          target: "/tmp/"
          strip_components: 2

      - name: Installer APK dans dossier distribution VPS
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 141.95.112.93
          username: ubuntu
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            set -euo pipefail
            test -f /tmp/sxb-vpn.apk
            # Le téléchargement public /download/*.apk est servi depuis ce répertoire.
            sudo mkdir -p /var/www/sxb-vpn/dist/download /var/www/apk
            sudo install -m 0644 /tmp/sxb-vpn.apk /var/www/sxb-vpn/dist/download/.sxbvpn-latest.apk.tmp
            sudo mv -f /var/www/sxb-vpn/dist/download/.sxbvpn-latest.apk.tmp /var/www/sxb-vpn/dist/download/sxbvpn-latest.apk
            # Conserver l’archive hors du chemin public pour diagnostic et rollback maîtrisé.
            sudo install -m 0644 /tmp/sxb-vpn.apk "/var/www/apk/sxbvpn-build-${{ github.run_number }}.apk"
            sudo install -m 0644 /tmp/sxb-vpn.apk /var/www/apk/sxbvpn-latest.apk
            echo "✅ Déployé: $(sha256sum /var/www/sxb-vpn/dist/download/sxbvpn-latest.apk)"
