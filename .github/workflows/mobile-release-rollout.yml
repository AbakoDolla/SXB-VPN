name: Mobile client readiness and update publication
run-name: Mobile ${{ inputs.mode }} — ${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, publish-all]
        default: inspect
        required: true
        description: "Read aggregate readiness, or explicitly publish the verified APK to all activated devices"
      operation_id:
        type: string
        required: true
        description: "Unique receipt identifier"
      version_code:
        type: string
        description: "Exact deployed APK versionCode (publish-all)"
      apk_sha256:
        type: string
        description: "Exact deployed APK SHA256 (publish-all)"
      publication_revision:
        type: string
        description: "Publication revision returned by inspect (publish-all)"
      confirmed:
        type: boolean
        default: false
        description: "Confirm all-device notification; no forced installation or account change"
permissions:
  contents: read
concurrency:
  group: publication-apk
  cancel-in-progress: false
jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Require the approved main revision
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Mobile production operations require main."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Encode the exact operator script
        run: |
          set -euo pipefail
          printf 'SXB_MOBILE_CODE=%s\n' "$(base64 -w0 scripts/mobile-release-rollout.cjs)" >> "$GITHUB_ENV"
      - name: Run bounded mobile operation
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          SXB_MOBILE_MODE: ${{ inputs.mode }}
          SXB_MOBILE_VERSION: ${{ inputs.version_code }}
          SXB_MOBILE_SHA: ${{ inputs.apk_sha256 }}
          SXB_MOBILE_PUBLICATION: ${{ inputs.publication_revision }}
          SXB_MOBILE_CONFIRMED: ${{ inputs.confirmed }}
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 90s
          envs: SXB_MOBILE_CODE,SXB_MOBILE_MODE,SXB_MOBILE_VERSION,SXB_MOBILE_SHA,SXB_MOBILE_PUBLICATION,SXB_MOBILE_CONFIRMED
          script: |
            set -euo pipefail
            set +x
            export NODE_OPTIONS= NODE_PATH=
            cd /var/www/sxb-vpn
            script_file="$(mktemp /tmp/sxb-mobile-rollout.XXXXXXXX.cjs)"
            trap 'rm -f "$script_file"' EXIT
            printf '%s' "$SXB_MOBILE_CODE" | base64 --decode > "$script_file"
            timeout 70s node "$script_file"
