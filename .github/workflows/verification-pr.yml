# Jusqu'ici, rien ne s'exécutait sur une pull request : les trois autres
# workflows ne se déclenchent que sur un push vers main. Une proposition
# n'était donc vérifiée qu'une fois fusionnée, c'est-à-dire en production.
#
# Ce workflow rejoue exactement les contrôles de construction du déploiement,
# mais sans jamais toucher au VPS : ni secret, ni connexion SSH, ni migration
# de production. Le test PostgreSQL utilise uniquement son conteneur jetable.
# Il n'a besoin que de lire le dépôt.
name: Vérification des propositions — SXB VPN

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verifier:
    name: Tests et construction
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sxb_security_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: sxb_security_impl
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U sxb_security_test -d sxb_security_impl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Installer les dépendances du workspace
        run: pnpm install --no-frozen-lockfile

      # Le même jeu d'assertions que celui exigé avant tout déploiement :
      # parité des schémas Prisma, cloisonnement des rôles, cohérence des
      # transports, épinglage des actions.
      - name: Garde-fous contre les régressions
        working-directory: app-mobile
        run: npx tsx --test tests/regression-critical-flows.test.ts ../server/tests/reseller-lifecycle.test.ts ../server/tests/session-user.test.ts ../server/tests/subscription-bulk.test.ts ../server/tests/free-trial.test.ts ../server/tests/dashboard-freshness.test.ts ../server/tests/admin-surface.test.ts ../server/tests/vpn-presence.test.ts ../server/tests/portee-comptes-presence.test.ts

      - name: Contrat de confidentialité santé mobile
        run: node --test scripts/tests/mobile-health-static.test.mjs

      # Une erreur de syntaxe dans un workflow ne se voit qu'au moment où
      # GitHub tente de le lancer, donc trop tard pour celui qui déploie.
      # Python plutôt que js-yaml : pnpm n'aplatit pas les dépendances
      # transitives, ce module n'est donc pas résolvable ici.
      - name: Syntaxe des workflows
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'VERIF'
          import pathlib, sys, yaml
          erreurs = 0
          for fichier in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              try:
                  yaml.safe_load(fichier.read_text(encoding='utf-8'))
                  print(f'ok   {fichier.name}')
              except yaml.YAMLError as e:
                  print(f'::error::{fichier.name} : {e}')
                  erreurs += 1
          sys.exit(1 if erreurs else 0)
          VERIF

      - name: Construction du tableau de bord
        working-directory: artifacts/sxb-dashboard
        env:
          PORT: '3000'
          BASE_PATH: '/'
          NODE_ENV: production
        run: pnpm run build

      # Le serveur est livré en bundle esbuild, sans vérification de types :
      # seule cette construction révèle une erreur de syntaxe ou un import
      # cassé avant qu'ils n'atteignent la production. Étape reprise telle
      # quelle du déploiement, pour vérifier ce qui sera réellement joué.
      # Pas de `set -e` ici : le `npm install` du backend sort en code non nul
      # sur ses avertissements de peer dependencies alors qu'il a bien
      # installé esbuild. Le résultat est contrôlé explicitement à la fin.
      - name: Construction du serveur
        run: |
          mkdir -p dist
          cd backend && npm install --legacy-peer-deps --no-audit --silent 2>&1 | tail -3 && cd ..
          ESBUILD=$(find backend/node_modules/.bin -name "esbuild" -executable | head -1)
          if [ -z "$ESBUILD" ]; then
            ESBUILD="npx --yes esbuild@0.27.3"
          fi
          echo "esbuild : $ESBUILD"
          $ESBUILD server.ts \
            --bundle \
            --platform=node \
            --format=cjs \
            --packages=external \
            --outfile=dist/server.cjs
          test -s dist/server.cjs
          echo "Serveur construit : $(du -sh dist/server.cjs | cut -f1)"

      - name: Parcours HTTP, verrouillage et langues du dashboard
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
        run: |
          node backend/node_modules/prisma/build/index.js generate --schema backend/prisma/schema.prisma
          node backend/node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
          node scripts/verify-prisma-runtime.cjs
          node --experimental-strip-types --test scripts/tests/*.test.mjs

      - name: Preuves transactionnelles PostgreSQL isolees
        env:
          # Identifiants synthetiques, valables uniquement pour ce conteneur CI.
          SXB_SECURITY_TEST_DATABASE_URL: postgresql://sxb_security_test:synthetic-ci-only@127.0.0.1:5432/sxb_security_impl
          SXB_SECURITY_PRISMA_CLIENT: ${{ runner.temp }}/sxb-security-prisma/index.js
          PRISMA_GENERATE_SKIP_AUTOINSTALL: '1'
        run: |
          set -euo pipefail
          export DATABASE_URL="$SXB_SECURITY_TEST_DATABASE_URL"
          node <<'PREPARE'
          const fs = require('node:fs');
          const path = require('node:path');
          const url = new URL(process.env.DATABASE_URL);
          if (url.hostname !== '127.0.0.1' || url.pathname !== '/sxb_security_impl') {
            throw new Error('Isolated CI database required');
          }
          const schema = fs.readFileSync('prisma/schema.prisma', 'utf8');
          const generator = /provider\s*=\s*"prisma-client-js"/;
          if (!generator.test(schema)) throw new Error('Prisma generator missing');
          const output = path.dirname(process.env.SXB_SECURITY_PRISMA_CLIENT);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'sxb-security-schema.prisma'),
            schema.replace(generator, match => `${match}\n  output = ${JSON.stringify(output)}`));
          PREPARE
          node backend/node_modules/prisma/build/index.js db push --skip-generate --schema "$RUNNER_TEMP/sxb-security-schema.prisma"
          node backend/node_modules/prisma/build/index.js db execute --schema "$RUNNER_TEMP/sxb-security-schema.prisma" --file prisma/security-layer.sql
          node backend/node_modules/prisma/build/index.js generate --schema "$RUNNER_TEMP/sxb-security-schema.prisma"
          node scripts/tests/security-layer-postgres.integration.mjs
