name: SSH private gateway - controlled rollout

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, enable, disable]
        default: inspect
        required: true
        description: Inspect is read-only; enable/disable change one profile's relay access.
      profile_id:
        type: string
        description: Exact profile ID returned by inspect (required for changes).
      expected_config_hash:
        type: string
        description: Exact current hash returned by inspect (required for changes).
      confirmed:
        type: boolean
        default: false
        description: Authorize the targeted change and backend restart.
      future_ssh_from:
        type: string
        description: Optional UTC ISO timestamp; enable also requires the gateway for SSH profiles created since then.

permissions:
  contents: read

concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  rollout:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://vpnsxb.afrihall.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Encode the reviewed operation
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(base64 -w0 scripts/ssh-relay-rollout.cjs)
          echo "::add-mask::$CODE"
          printf 'SXB_RELAY_ROLLOUT_CODE=%s\n' "$CODE" >> "$GITHUB_ENV"
      - name: Verify or change only the selected private SSH profile
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          SXB_SSH_RELAY_ROLLOUT_CONFIG: ${{ secrets.SXB_SSH_RELAY_ROLLOUT_CONFIG }}
          SXB_RELAY_MODE: ${{ inputs.mode }}
          SXB_RELAY_PROFILE_ID: ${{ inputs.profile_id }}
          SXB_RELAY_EXPECTED_HASH: ${{ inputs.expected_config_hash }}
          SXB_RELAY_CONFIRMED: ${{ inputs.confirmed }}
          SXB_RELAY_EXPECTED_SHA: ${{ github.sha }}
          SXB_RELAY_FUTURE_SSH_FROM: ${{ inputs.future_ssh_from }}
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 8m
          envs: SXB_RELAY_ROLLOUT_CODE,SXB_SSH_RELAY_ROLLOUT_CONFIG,SXB_RELAY_MODE,SXB_RELAY_PROFILE_ID,SXB_RELAY_EXPECTED_HASH,SXB_RELAY_CONFIRMED,SXB_RELAY_EXPECTED_SHA,SXB_RELAY_FUTURE_SSH_FROM
          script: |
            set +x
            set -euo pipefail
            export NODE_OPTIONS= NODE_PATH=
            cd /var/www/sxb-vpn
            printf '%s' "$SXB_RELAY_ROLLOUT_CODE" | base64 --decode | timeout 450s node
