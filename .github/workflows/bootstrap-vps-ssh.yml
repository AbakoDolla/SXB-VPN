name: Bootstrap VPS SSH key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Install dedicated SSH public key
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vpnsxb.afrihall.com
    steps:
      - name: Install public key with transition password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 141.95.112.93
          username: ubuntu
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          timeout: 30s
          command_timeout: 30s
          script_stop: true
          envs: VPS_SSH_PUBLIC_KEY
          script: |
            set -euo pipefail
            test -n "${VPS_SSH_PUBLIC_KEY:-}"
            install -d -m 700 /home/ubuntu/.ssh
            touch /home/ubuntu/.ssh/authorized_keys
            chmod 600 /home/ubuntu/.ssh/authorized_keys
            grep -qxF "$VPS_SSH_PUBLIC_KEY" /home/ubuntu/.ssh/authorized_keys || printf '%s\n' "$VPS_SSH_PUBLIC_KEY" >> /home/ubuntu/.ssh/authorized_keys
            echo "SSH public key bootstrap verified"
        env:
          VPS_SSH_PUBLIC_KEY: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
