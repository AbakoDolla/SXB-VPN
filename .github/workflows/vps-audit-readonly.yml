name: 🔍 VPS Read-Only Audit (temporary)

on:
  push:
    branches:
      - copilot/sxb-vpn-analysis
    paths:
      - '.github/workflows/vps-audit-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit VPS without changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://vpnsxb.afrihall.com

    steps:
      - name: Verify dedicated SSH access (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 30s
          script_stop: true
          script: |
            set -euo pipefail
            test "$(id -un)" = "ubuntu"
            test -r /var/www/sxb-vpn/.git/HEAD
            test "$(git -C /var/www/sxb-vpn rev-parse --is-inside-work-tree)" = "true"
            git -C /var/www/sxb-vpn rev-parse --verify HEAD >/dev/null
            echo "SSH_READ_ONLY_PREFLIGHT=ok"

      - name: Probe public endpoints (read-only)
        shell: bash
        run: |
          set +e
          probe() {
            local label="$1"
            local url="$2"
            local code
            code="$(curl --silent --show-error --location --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$url")"
            printf '%s=%s\n' "$label" "${code:-000}"
          }

          echo "=== PUBLIC ENDPOINTS ==="
          probe dashboard_https https://vpnsxb.afrihall.com/
          probe api_health_https https://vpnsxb.afrihall.com/api/health
          probe xpanel_https_8443 https://vpnsxb.afrihall.com:8443/api/v1/ping

          echo "=== PUBLIC TLS CERTIFICATE ==="
          timeout 15 openssl s_client \
            -connect 141.95.112.93:443 \
            -servername vpnsxb.afrihall.com </dev/null 2>/dev/null |
            openssl x509 -noout -subject -issuer -dates -fingerprint -sha256
          exit 0

      - name: Audit VPS state (read-only and redacted)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 8m
          script: |
            set -uo pipefail

            redact() {
              sed -E \
                -e 's/(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})/[REDACTED_GITHUB_TOKEN]/g' \
                -e 's#(https?://)[^/@[:space:]]+@#\1[REDACTED]@#g' \
                -e 's/((password|passwd|secret|authorization|cookie)[[:space:]]*[:=][[:space:]]*)[^[:space:],;]+/\1[REDACTED]/Ig'
            }

            section() {
              printf '\n════════ %s ════════\n' "$1"
            }

            audit() {
              set +e
              export GIT_OPTIONAL_LOCKS=0
              local app="/var/www/sxb-vpn"
              local sudo_cmd=""

              if sudo -n true 2>/dev/null; then
                sudo_cmd="sudo -n"
              fi

              section "AUDIT METADATA"
              printf 'audit_utc=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              printf 'mode=read-only\n'
              printf 'user=%s\n' "$(id -un)"

              section "SYSTEM"
              printf 'hostname=%s\n' "$(hostname)"
              if [ -r /etc/os-release ]; then
                . /etc/os-release
                printf 'os=%s\n' "${PRETTY_NAME:-unknown}"
              fi
              printf 'kernel=%s\n' "$(uname -r)"
              uptime
              free -h
              df -hT / /var 2>/dev/null | awk '!seen[$NF]++'
              if [ -e /var/run/reboot-required ]; then
                echo "reboot_required=yes"
              else
                echo "reboot_required=no"
              fi

              section "PROJECT AND GIT"
              if [ ! -d "$app/.git" ]; then
                echo "project_repository=missing"
                return 2
              fi
              stat -c 'project_mode=%a project_owner=%U:%G' "$app"
              if [ -f "$app/.env" ]; then
                stat -c 'env_mode=%a env_owner=%U:%G' "$app/.env"
              else
                echo "env_file=missing"
              fi
              printf 'branch=%s\n' "$(git -C "$app" branch --show-current)"
              printf 'head=%s\n' "$(git -C "$app" rev-parse HEAD)"
              git -C "$app" log -1 --format='head_commit=%H|%cI|%s'
              if git -C "$app" rev-parse --verify origin/main >/dev/null 2>&1; then
                printf 'origin_main=%s\n' "$(git -C "$app" rev-parse origin/main)"
                if [ "$(git -C "$app" rev-parse HEAD)" = "$(git -C "$app" rev-parse origin/main)" ]; then
                  echo "head_matches_origin_main=yes"
                else
                  echo "head_matches_origin_main=no"
                fi
              else
                echo "origin_main=unavailable_without_fetch"
              fi
              printf 'origin_url='
              git -C "$app" remote get-url origin 2>/dev/null || echo unavailable
              echo "working_tree:"
              git -C "$app" status --short
              echo "tracked_environment_files:"
              git -C "$app" ls-files '.env' '.env.*' | grep -vFx '.env.example' || echo none
              du -sh "$app" "$app/dist" "$app/backend/node_modules" 2>/dev/null

              section "PM2 AND SERVICES"
              if command -v pm2 >/dev/null 2>&1 && [ -S "$HOME/.pm2/rpc.sock" ]; then
                pm2 jlist 2>/dev/null | node -e '
                  const fs = require("fs");
                  const processes = JSON.parse(fs.readFileSync(0, "utf8"));
                  for (const process of processes) {
                    const env = process.pm2_env || {};
                    const monitor = process.monit || {};
                    console.log(JSON.stringify({
                      name: process.name,
                      status: env.status,
                      pid: process.pid,
                      restarts: env.restart_time,
                      unstableRestarts: env.unstable_restarts,
                      uptime: env.pm_uptime,
                      memoryBytes: monitor.memory,
                      script: env.pm_exec_path,
                      cwd: env.pm_cwd
                    }));
                  }
                '
              else
                echo "pm2=not_found_or_daemon_unavailable"
              fi

              for service in \
                ssh nginx pm2-ubuntu postgresql redis-server fail2ban docker \
                sing-box xray v2ray dropbear-vpn sshd-vpntunnel sshd-ws \
                websockify-ssh; do
                printf '%s active=%s enabled=%s\n' \
                  "$service" \
                  "$(systemctl is-active "$service" 2>/dev/null || true)" \
                  "$(systemctl is-enabled "$service" 2>/dev/null || true)"
              done
              echo "failed_units:"
              systemctl --failed --no-legend --no-pager 2>/dev/null || true

              if [ -n "$sudo_cmd" ] && $sudo_cmd docker info >/dev/null 2>&1; then
                echo "docker_containers:"
                $sudo_cmd docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Ports}}'
              else
                echo "docker_access=unavailable_or_unused"
              fi

              section "NETWORK AND FIREWALL"
              if [ -n "$sudo_cmd" ]; then
                $sudo_cmd ss -lntupH 2>/dev/null |
                  awk '{print $1, $2, $5, $7}' |
                  sort -k3,3
                echo "ufw:"
                $sudo_cmd ufw status verbose 2>/dev/null || echo unavailable
                echo "fail2ban_sshd:"
                $sudo_cmd fail2ban-client status sshd 2>/dev/null |
                  grep -E 'Currently failed|Total failed|Currently banned|Total banned' ||
                  echo unavailable
              else
                ss -lntuH 2>/dev/null | awk '{print $1, $2, $5}' | sort -k3,3
                echo "privileged_network_checks=unavailable"
              fi

              echo "effective_sshd_security:"
              if [ -n "$sudo_cmd" ]; then
                $sudo_cmd sshd -T 2>/dev/null |
                  grep -E '^(permitrootlogin|passwordauthentication|pubkeyauthentication|maxauthtries|x11forwarding|allowtcpforwarding|permitemptypasswords|kbdinteractiveauthentication) '
              else
                sshd -T 2>/dev/null |
                  grep -E '^(permitrootlogin|passwordauthentication|pubkeyauthentication|maxauthtries|x11forwarding|allowtcpforwarding|permitemptypasswords|kbdinteractiveauthentication) '
              fi
              if [ -f "$HOME/.ssh/authorized_keys" ]; then
                stat -c 'authorized_keys_mode=%a owner=%U:%G' "$HOME/.ssh/authorized_keys"
                printf 'authorized_key_count=%s\n' \
                  "$(grep -Ev '^[[:space:]]*(#|$)' "$HOME/.ssh/authorized_keys" | wc -l)"
              fi

              section "NGINX AND TLS"
              if [ -n "$sudo_cmd" ]; then
                $sudo_cmd nginx -t 2>&1
                echo "nginx_routes:"
                $sudo_cmd nginx -T 2>/dev/null |
                  grep -E '^[[:space:]]*(listen|server_name|root|proxy_pass)[[:space:]]' |
                  sed -E 's/[[:space:]]+/ /g' |
                  sort -u
                if $sudo_cmd test -r /etc/letsencrypt/live/vpnsxb.afrihall.com/fullchain.pem; then
                  echo "dashboard_certificate:"
                  $sudo_cmd openssl x509 \
                    -in /etc/letsencrypt/live/vpnsxb.afrihall.com/fullchain.pem \
                    -noout -subject -issuer -dates -fingerprint -sha256
                fi
              else
                nginx -t 2>&1 || true
              fi

              section "HEALTH PROBES"
              probe() {
                local label="$1"
                local url="$2"
                shift 2
                local code
                code="$(curl --silent --show-error --location --max-time 10 \
                  --output /dev/null --write-out '%{http_code}' "$@" "$url")"
                printf '%s=%s\n' "$label" "${code:-000}"
              }
              probe backend_local http://127.0.0.1:4000/api/health
              probe dashboard_local_https https://vpnsxb.afrihall.com/ \
                --resolve vpnsxb.afrihall.com:443:127.0.0.1
              probe dashboard_public_https https://vpnsxb.afrihall.com/
              probe api_public_https https://vpnsxb.afrihall.com/api/health
              probe xpanel_local http://127.0.0.1:18790/api/v1/ping
              probe xpanel_public_8443 https://vpnsxb.afrihall.com:8443/api/v1/ping

              section "POSTGRESQL READ-ONLY"
              if [ ! -r "$app/.env" ]; then
                echo "database_audit=env_unreadable"
              elif ! command -v psql >/dev/null 2>&1; then
                echo "database_audit=psql_missing"
              else
                local database_url
                local pglib_url
                local db_query
                local db_output
                local db_rc
                database_url="$(sed -n 's/^DATABASE_URL=//p' "$app/.env" | head -n 1 | tr -d '\r')"
                if [[ "$database_url" == \"*\" ]] || [[ "$database_url" == \'*\' ]]; then
                  database_url="${database_url:1:${#database_url}-2}"
                fi
                pglib_url="$(printf '%s' "$database_url" |
                  sed -E 's/([?&])schema=[^&]*&?/\1/; s/[?&]$//')"

                db_query="
                BEGIN READ ONLY;
                SELECT 'postgres_version=' || current_setting('server_version');
                SELECT 'database_size_bytes=' || pg_database_size(current_database());
                SELECT 'public_table_count=' || count(*) FROM pg_tables WHERE schemaname = 'public';
                SELECT 'active_connections=' || count(*) FROM pg_stat_activity WHERE datname = current_database();
                SELECT 'long_transactions_over_5m=' || count(*)
                  FROM pg_stat_activity
                  WHERE xact_start IS NOT NULL AND now() - xact_start > interval '5 minutes';
                SELECT 'prisma_migrations=' ||
                  CASE WHEN to_regclass('public._prisma_migrations') IS NULL
                    THEN 'absent' ELSE 'present' END;
                SELECT relname || '_rows_estimate=' || n_live_tup
                  FROM pg_stat_user_tables
                  WHERE relname IN (
                    'users',
                    'vpn_clients',
                    'vpn_profiles',
                    'subscriptions',
                    'subscription_devices',
                    'app_registrations',
                    'traffic_usage'
                  )
                  ORDER BY relname;
                SELECT 'invalid_indexes=' || count(*) FROM pg_index WHERE NOT indisvalid;
                COMMIT;
                "
                db_output="$(
                  PGAPPNAME=sxb-readonly-audit \
                  PGCONNECT_TIMEOUT=8 \
                  PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=10000' \
                  psql "$pglib_url" -X -q -v ON_ERROR_STOP=1 -At \
                    -c "$db_query" 2>/dev/null
                )"
                db_rc=$?
                if [ "$db_rc" -eq 0 ]; then
                  echo "database_audit=ok"
                  printf '%s\n' "$db_output"
                else
                  echo "database_audit=failed"
                fi
                unset database_url pglib_url db_query db_output
              fi

              section "BACKUPS"
              for backup_root in "$HOME/sxb-backups" /var/backups/sxb-vpn; do
                if [ -n "$sudo_cmd" ]; then
                  if ! $sudo_cmd test -d "$backup_root"; then
                    printf '%s=absent\n' "$backup_root"
                    continue
                  fi
                elif [ ! -d "$backup_root" ]; then
                  printf '%s=absent\n' "$backup_root"
                  continue
                fi

                local dump_count
                local latest_dump
                if [ -n "$sudo_cmd" ]; then
                  dump_count="$($sudo_cmd find "$backup_root" -type f -name '*.dump' 2>/dev/null | wc -l)"
                  latest_dump="$($sudo_cmd find "$backup_root" -type f -name '*.dump' \
                    -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"
                else
                  dump_count="$(find "$backup_root" -type f -name '*.dump' 2>/dev/null | wc -l)"
                  latest_dump="$(find "$backup_root" -type f -name '*.dump' \
                    -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"
                fi
                printf 'backup_root=%s dump_count=%s\n' "$backup_root" "$dump_count"
                if [ -n "$latest_dump" ]; then
                  if [ -n "$sudo_cmd" ]; then
                    $sudo_cmd stat -c 'latest_dump=%n size=%s modified=%y mode=%a owner=%U:%G' "$latest_dump"
                    if $sudo_cmd pg_restore --list "$latest_dump" >/dev/null 2>&1; then
                      echo "latest_dump_manifest=readable"
                    else
                      echo "latest_dump_manifest=invalid_or_unreadable"
                    fi
                  else
                    stat -c 'latest_dump=%n size=%s modified=%y mode=%a owner=%U:%G' "$latest_dump"
                    if pg_restore --list "$latest_dump" >/dev/null 2>&1; then
                      echo "latest_dump_manifest=readable"
                    else
                      echo "latest_dump_manifest=invalid_or_unreadable"
                    fi
                  fi
                fi
              done
              echo "relevant_timers:"
              systemctl list-timers --all --no-pager 2>/dev/null |
                grep -Ei 'backup|certbot|apt|fstrim' || echo none

              section "LOG HEALTH (COUNTS ONLY)"
              if [ -n "$sudo_cmd" ]; then
                for unit in ssh nginx postgresql redis-server fail2ban; do
                  printf '%s_warning_or_higher_24h=%s\n' \
                    "$unit" \
                    "$($sudo_cmd journalctl -u "$unit" --since '24 hours ago' \
                      -p warning --no-pager -q 2>/dev/null | wc -l)"
                done
                auth_log="$($sudo_cmd journalctl -u ssh --since '24 hours ago' \
                  --no-pager -q 2>/dev/null)"
                printf 'ssh_failed_auth_24h=%s\n' \
                  "$(printf '%s\n' "$auth_log" |
                    grep -Eic 'Failed password|Invalid user|authentication failure')"
                printf 'ssh_accepted_auth_24h=%s\n' \
                  "$(printf '%s\n' "$auth_log" |
                    grep -Eic 'Accepted (publickey|password)')"
                unset auth_log
              fi

              for log_file in \
                "$HOME/.pm2/logs/sxb-backend-error.log" \
                "$HOME/.pm2/logs/sxb-backend-out.log" \
                /var/log/nginx/sxb_vpn_error.log; do
                if [ -r "$log_file" ]; then
                  stat -c 'log=%n size=%s modified=%y' "$log_file"
                  printf 'recent_error_markers=%s\n' \
                    "$(tail -n 2000 "$log_file" |
                      grep -Eic 'error|exception|fatal|unhandled|ECONN|timeout')"
                elif [ -n "$sudo_cmd" ] && $sudo_cmd test -r "$log_file"; then
                  $sudo_cmd stat -c 'log=%n size=%s modified=%y' "$log_file"
                  printf 'recent_error_markers=%s\n' \
                    "$($sudo_cmd tail -n 2000 "$log_file" |
                      grep -Eic 'error|exception|fatal|unhandled|ECONN|timeout')"
                fi
              done

              section "END"
              echo "audit_complete=yes"
            }

            audit 2>&1 | redact
            exit "${PIPESTATUS[0]}"
