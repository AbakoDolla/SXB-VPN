name: Diagnose asset delivery

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: From GitHub runner (external vantage)
        run: |
          ASSET=$(curl -s https://vpnsxb.afrihall.com/ | grep -oE 'assets/[^\" ]+\.js' | head -1)
          echo "Asset: $ASSET"
          DECLARED=$(curl -sI "https://vpnsxb.afrihall.com/$ASSET" | grep -i content-length | tr -d '\r' | awk '{print $2}')
          echo "Content-Length declared: $DECLARED"
          for i in 1 2 3; do
            GOT=$(curl -s -o /tmp/a.js -w '%{size_download}' "https://vpnsxb.afrihall.com/$ASSET")
            echo "  attempt $i: got $GOT"
          done
          echo "ASSET_PATH=$ASSET" >> $GITHUB_ENV

      - name: From the VPS itself (internal vantage)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 141.95.112.93
          username: ubuntu
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
          script: |
            cd /var/www/sxb-vpn
            F=$(ls -S artifacts/sxb-dashboard/dist/assets/*.js 2>/dev/null | head -1)
            echo "=== file on disk ==="
            ls -l "$F"
            echo "=== disk usage ==="
            df -h / | tail -1
            echo "=== nginx -> localhost (loopback, no network) ==="
            for i in 1 2 3; do
              curl -s -o /tmp/x.js -w "  attempt $i: %{size_download} in %{time_total}s\n" \
                -H "Host: vpnsxb.afrihall.com" "http://127.0.0.1/$(basename $(dirname $F))/$(basename $F)" || true
            done
            echo "=== nginx config: gzip / sendfile / limit_rate / proxy ==="
            sudo grep -rniE "gzip|sendfile|limit_rate|send_timeout|output_buffers|aio " /etc/nginx/nginx.conf /etc/nginx/sites-enabled/ 2>/dev/null | grep -v "^\s*#" | head -40
            echo "=== nginx error log (tail) ==="
            sudo tail -30 /var/log/nginx/error.log 2>/dev/null || true
