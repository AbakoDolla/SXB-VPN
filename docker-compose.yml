version: '3.8'

# ⚠️  Les secrets ne sont JAMAIS mis en dur ici.
# Copier .env.example → .env et remplir les valeurs avant docker compose up.
# Le fichier .env est dans .gitignore et ne doit jamais être commité.

services:
  # SXB VPN Full-Stack Application Gateway
  sxb-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sxb_vpn_backend
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sxb-network

  # SXB Dashboard Frontend
  sxb-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: sxb_vpn_dashboard
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - VITE_API_URL=${API_URL}/api
    depends_on:
      - sxb-backend
    networks:
      - sxb-network

  # Dedicated High-Availability PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sxb_vpn_postgres
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - sxb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sxb-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sxb_vpn_redis
    restart: always
    env_file:
      - .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - sxb_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sxb-network

networks:
  sxb-network:
    driver: bridge

volumes:
  sxb_postgres_data:
    driver: local
  sxb_redis_data:
    driver: local
